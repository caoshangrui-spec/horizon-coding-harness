[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "horizon-coding-harness"
version = "0.3.0"
description = "Durable control plane for long-horizon software engineering agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
horizon = "horizon.interfaces.cli.app:app"

[tool.hatch.build]
skip-excluded-dirs = true

[dependency-groups]
dev = [
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: requires a reachable Linux Docker engine and a preinstalled image"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["benchmarks/**/fixture/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
