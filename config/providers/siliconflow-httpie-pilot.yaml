schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash-httpie-pilot-0053-v1
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  # 384 keeps headroom above the latest observed 257-token planner response while
  # reducing the conservative reservation for the expected post-retrieval call.
  max_output_tokens: 384
  probe_max_output_tokens: 128
  max_attempts: 1
  enable_thinking: false
  max_context_chars: 5000
  max_input_tokens: 120000
  preserve_recent_context_units: 2

pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: siliconflow-2026-09-01-normal-period
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  # A new immutable zero-spend Campaign definition for offline preflight only.
  # It does not authorize a paid request or raise the previous CNY 0.25 series cap.
  campaign_id: siliconflow-httpie-pilot-2026-10
  currency: CNY
  max_cost: "0.053"
  max_cost_per_call: "0.053"

# Historical settled series cost is CNY 0.2064492. A fully spent Run would make the
# series CNY 0.2594492, so launch requires a fresh explicit cumulative cap of at least
# CNY 0.2594492 (normally rounded to CNY 0.26). This checked-in policy is not approval.
run_budget:
  currency: CNY
  max_cost: "0.053"

ledger_path: .horizon/siliconflow-httpie-campaign.sqlite3
fallback_enabled: false
