schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  max_output_tokens: 2048
  probe_max_output_tokens: 128
  max_attempts: 2
  enable_thinking: false
  # Deterministic character bound for the model-visible projection. The full
  # canonical transcript remains in immutable artifacts.
  max_context_chars: 60000
  preserve_recent_context_units: 6

# Conservative normal-period ceiling, CNY per one million tokens.
# The ledger intentionally does not rely on lower time-of-day promotional pricing.
pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: "siliconflow-2026-09-01-normal-period"
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  campaign_id: siliconflow-integration-2026-10
  currency: CNY
  max_cost: "3.00"
  max_cost_per_call: "1.00"

run_budget:
  currency: CNY
  max_cost: "1.00"

ledger_path: .horizon/siliconflow-campaign.sqlite3
fallback_enabled: false
