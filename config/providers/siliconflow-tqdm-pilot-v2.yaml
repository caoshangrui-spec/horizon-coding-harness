schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash-tqdm-pilot-0062-v2
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  max_output_tokens: 768
  probe_max_output_tokens: 128
  max_attempts: 1
  enable_thinking: false
  max_context_chars: 5000
  max_input_tokens: 120000
  preserve_recent_context_units: 2

pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: "siliconflow-2026-09-01-normal-period"
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  # Continue the immutable retry Campaign; do not create a second budget pool.
  campaign_id: siliconflow-pilot-retry-2026-10
  currency: CNY
  max_cost: "0.18"
  max_cost_per_call: "0.18"

# The Campaign has CNY 0.1174074 settled after the first tqdm attempt. A future
# CNY 0.062 Run would leave CNY 0.0005926 Campaign headroom. The full paid series
# would remain at or below CNY 0.2446472, under the user's CNY 0.25 ceiling.
run_budget:
  currency: CNY
  max_cost: "0.062"

ledger_path: .horizon/siliconflow-campaign.sqlite3
fallback_enabled: false
