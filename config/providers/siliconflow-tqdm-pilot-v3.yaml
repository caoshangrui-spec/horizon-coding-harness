schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash-tqdm-pilot-0049-v3
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  max_output_tokens: 768
  probe_max_output_tokens: 128
  max_attempts: 1
  enable_thinking: false
  max_context_chars: 5000
  max_input_tokens: 120000
  preserve_recent_context_units: 2

pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: siliconflow-2026-09-01-normal-period
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  # Reuse the immutable retry Campaign; this file does not authorize another paid Run.
  campaign_id: siliconflow-pilot-retry-2026-10
  currency: CNY
  max_cost: "0.18"
  max_cost_per_call: "0.18"

# Historical settled series cost is CNY 0.1954812. Reserving this complete Run cap would keep
# the series at or below CNY 0.2444812 and the existing Campaign at or below CNY 0.1792414.
# Actual launch still requires a fresh matching preflight and explicit user authorization.
run_budget:
  currency: CNY
  max_cost: "0.049"

ledger_path: .horizon/siliconflow-campaign.sqlite3
fallback_enabled: false
