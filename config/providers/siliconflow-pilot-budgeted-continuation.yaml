schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash-pilot-budgeted-continuation-011
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  max_output_tokens: 1024
  probe_max_output_tokens: 128
  max_attempts: 1
  enable_thinking: false
  # Keeps the conservative byte-based reservation below the remaining Campaign headroom while
  # retaining one ranked code chunk or one ranged file read in the active model view.
  max_context_chars: 7000
  preserve_recent_context_units: 2

pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: "siliconflow-2026-09-01-normal-period"
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  # Reuse the immutable retry Campaign; all attempts remain bounded by its original CNY 0.18 cap.
  campaign_id: siliconflow-pilot-retry-2026-10
  currency: CNY
  max_cost: "0.18"
  max_cost_per_call: "0.18"

# The Campaign currently has CNY 0.1185186 remaining. This leaves a ledger safety margin.
run_budget:
  currency: CNY
  max_cost: "0.11"

ledger_path: .horizon/siliconflow-campaign.sqlite3
fallback_enabled: false
