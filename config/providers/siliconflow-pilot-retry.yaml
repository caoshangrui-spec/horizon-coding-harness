schema_version: "1.0"
policy_id: siliconflow-deepseek-v4-flash-pilot-retry-018
provider_id: siliconflow
api_type: openai_chat_completions
base_url: https://api.siliconflow.cn/v1
credential_env: SILICONFLOW_API_KEY

model:
  id: deepseek-ai/DeepSeek-V4-Flash
  supports_tools: true

request:
  timeout_seconds: 120
  max_output_tokens: 1024
  probe_max_output_tokens: 128
  # No hidden provider retry. This policy is for at most one explicitly approved retry Run.
  max_attempts: 1
  enable_thinking: false
  max_context_chars: 60000
  max_input_tokens: 120000
  preserve_recent_context_units: 6

pricing:
  currency: CNY
  input_per_million: "3.00"
  cached_input_per_million: "0.30"
  output_per_million: "9.00"
  version: "siliconflow-2026-09-01-normal-period"
  source_url: https://docs.siliconflow.cn/docs/release-notes/overview
  conservative_ceiling: true

campaign:
  # Separate hard ceiling for every attempt made with this retry policy.
  campaign_id: siliconflow-pilot-retry-2026-10
  currency: CNY
  max_cost: "0.18"
  max_cost_per_call: "0.18"

# First pilot cost CNY 0.0652398. This independent CNY 0.18 Campaign means all
# retry attempts combined keep the experiment at or below CNY 0.2452398.
run_budget:
  currency: CNY
  max_cost: "0.18"

ledger_path: .horizon/siliconflow-campaign.sqlite3
fallback_enabled: false
