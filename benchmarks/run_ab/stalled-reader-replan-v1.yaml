schema_version: 1
benchmark_id: stalled-reader-replan-v1
fixture_path: fixtures/stalled-reader

task:
  task_id: shell-parser-empty-input
  title: Repair empty-input formatting
  objective: Return [] for empty input and [value] for non-empty input
  repository:
    source: local
    path: /fixture
    base_commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  constraints:
    allowed_paths: [src/**, tests/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: parser-contract
      command: sh tests/test_parser.sh
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 10
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: investigate-parser
      title: Inspect the parser failure
      objective: Establish evidence before selecting a bounded repair
      dependencies: []
      expected_artifacts: [src/parser.sh, parser-contract receipt]
      acceptance_ids: [parser-contract]
      allowed_tools: [read_file]

expected_initial_failed_checks: [parser-contract]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the exact stalled read pattern until the controller requests guidance.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &read_parser
        tool: read_file
        arguments: {path: src/parser.sh}
      - *read_parser
      - *read_parser
      - *read_parser

  - arm_id: single-replan
    role: single_replan
    description: Use the soft-block evidence to replace the investigation item and finish the task.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-parser]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *read_parser
      - *read_parser
      - *read_parser
      - tool: revise_plan
        arguments:
          reason: Repeated reads produced no new evidence; replace investigation with an edit-ready item.
          items:
            - work_item_id: repair-parser
              title: Apply the evidence-backed parser repair
              objective: Implement the frozen empty and non-empty formatting contract
              dependencies: []
              expected_artifacts: [src/parser.sh, parser-contract receipt]
              acceptance_ids: [parser-contract]
              allowed_tools: [read_file, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: src/parser.sh
          old: |
            #!/bin/sh
            value="${1-}"
            printf '%s\n' "$value"
          new: |
            #!/bin/sh
            value="${1-}"
            if [ -z "$value" ]; then
              printf '[]\n'
            else
              printf '[%s]\n' "$value"
            fi
      - tool: submit
        arguments:
          summary: Replanned from stalled investigation to a bounded parser repair and verified it.
