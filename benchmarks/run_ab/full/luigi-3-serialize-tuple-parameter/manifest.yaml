schema_version: 1
benchmark_id: luigi-3-serialize-tuple-parameter-full
fixture_path: fixture

task:
  task_id: luigi-serialize-tuple-parameter-full
  title: Parse a serialized flat tuple
  objective: Round-trip a tuple whose JSON elements are scalar values
  repository:
    source: local
    path: /fixture
    base_commit: a0f1db01ddab5b4b2bda3fbe58bad09a6d94a7b4
  constraints:
    allowed_paths: ["**"]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: luigi-tuple-parameter-full
      command: >-
        python -B -c "import ast,json; from collections import OrderedDict; from pathlib import Path; source=Path('luigi/parameter.py').read_text(encoding='utf-8'); tree=ast.parse(source); klass=next(item for item in tree.body if isinstance(item,ast.ClassDef) and item.name=='TupleParameter'); node=next(item for item in klass.body if isinstance(item,ast.FunctionDef) and item.name=='parse'); namespace={'json':json,'_FrozenOrderedDict':OrderedDict,'literal_eval':ast.literal_eval}; exec(compile(ast.Module(body=[node],type_ignores=[]),'luigi/parameter.py','exec'),namespace); observed=namespace['parse'](None,json.dumps((1,2,3))); assert observed==(1,2,3) and isinstance(observed,tuple),observed"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 14
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: locate-tuple-parameter-parser-full
      title: Locate tuple parameter parsing
      objective: Retrieve revision-bound evidence before changing tuple normalization
      dependencies: []
      expected_artifacts: [Code EvidencePack, luigi-tuple-parameter-full receipt]
      acceptance_ids: [luigi-tuple-parameter-full]
      allowed_tools: [retrieve_code]

expected_initial_failed_checks: [luigi-tuple-parameter-full]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source retrieval until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &retrieve_target
        tool: retrieve_code
        arguments:
          query: serialize tuple parameter TupleParameter parse
          max_chunks: 8
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with the bounded upstream tuple repair.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-tuple-parameter-parser-full]
    expected_model_calls: 7
    expected_tool_calls: 8
    expected_steps: 8
    actions:
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target
      - tool: revise_plan
        arguments:
          reason: Repeated retrieval produced no new evidence; normalize both JSON and literal tuple inputs.
          items:
            - work_item_id: repair-tuple-parameter-parser-full
              title: Normalize serialized tuple values
              objective: Catch scalar JSON tuple conversion and return an immutable tuple
              dependencies: []
              expected_artifacts: [luigi/parameter.py, luigi-tuple-parameter-full receipt]
              acceptance_ids: [luigi-tuple-parameter-full]
              allowed_tools: [retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: luigi/parameter.py
          old: "            return tuple(tuple(x) for x in json.loads(x, object_pairs_hook=_FrozenOrderedDict))"
          new: "            return tuple(tuple(x) for x in json.loads(x, object_pairs_hook=_FrozenOrderedDict))\n        except TypeError:\n            return tuple(literal_eval(x))"
      - tool: replace_text
        arguments:
          path: luigi/parameter.py
          old: "            return literal_eval(x)  # if this causes an error, let that error be raised."
          new: "            return tuple(literal_eval(x))  # if this causes an error, let that error be raised."
      - tool: submit
        arguments:
          summary: Normalized serialized scalar tuples and ran the protected round-trip regression check.
