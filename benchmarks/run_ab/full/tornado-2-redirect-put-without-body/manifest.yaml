schema_version: 1
benchmark_id: tornado-2-redirect-put-without-body-full
fixture_path: fixture

task:
  task_id: tornado-redirect-put-without-body-full
  title: Preserve chunked PUT redirects without a body
  objective: Keep client chunking enabled when a redirected PUT already carries Transfer-Encoding chunked
  repository:
    source: local
    path: /fixture
    base_commit: 2ca8821d006f6693f920a4b183a3a7c985a5c8ad
  constraints:
    allowed_paths: ["**"]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: tornado-redirect-put-without-body-full
      command: >-
        python -B -c "import ast; from pathlib import Path; from types import SimpleNamespace; tree=ast.parse(Path('tornado/http1connection.py').read_text(encoding='utf-8')); klass=next(item for item in tree.body if isinstance(item,ast.ClassDef) and item.name=='HTTP1Connection'); method=next(item for item in klass.body if isinstance(item,ast.FunctionDef) and item.name=='write_headers'); branch=next(item for item in method.body if isinstance(item,ast.If) and isinstance(item.test,ast.Attribute) and item.test.attr=='is_client'); pick=lambda body:next(item for item in body if isinstance(item,ast.Assign) and any(isinstance(target,ast.Attribute) and target.attr=='_chunking_output' for target in item.targets)); expressions=[compile(ast.Expression(pick(body).value),'tornado/http1connection.py','eval') for body in (branch.body,branch.orelse)]; evaluate=lambda expression,self_obj,start_line,headers:eval(expression,{}, {'self':self_obj,'start_line':start_line,'headers':headers}); client=SimpleNamespace(is_client=True); request=lambda method:SimpleNamespace(method=method); assert evaluate(expressions[0],client,request('PUT'),{'Transfer-Encoding':'chunked'}) is True; assert evaluate(expressions[0],client,request('PUT'),{'Transfer-Encoding':'gzip'}) is False; assert evaluate(expressions[0],client,request('PUT'),{'Content-Length':'0'}) is False; assert evaluate(expressions[0],client,request('GET'),{}) is False; server=SimpleNamespace(is_client=False,_request_start_line=SimpleNamespace(version='HTTP/1.1')); assert evaluate(expressions[1],server,SimpleNamespace(code=200),{'Transfer-Encoding':'chunked'}) is False"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 12
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: locate-redirect-chunking-full
      title: Locate redirected request chunking
      objective: Retrieve revision-bound evidence before changing client framing
      dependencies: []
      expected_artifacts: [Code EvidencePack, tornado-redirect-put-without-body-full receipt]
      acceptance_ids: [tornado-redirect-put-without-body-full]
      allowed_tools: [retrieve_code]

expected_initial_failed_checks: [tornado-redirect-put-without-body-full]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source retrieval until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &retrieve_target
        tool: retrieve_code
        arguments:
          query: HTTP1Connection redirected PUT chunked Transfer-Encoding
          max_chunks: 8
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with a bounded behavior-preserving chunking repair.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-redirect-chunking-full]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target
      - tool: revise_plan
        arguments:
          reason: Repeated retrieval produced no new evidence; accept an existing chunked header when deciding client framing.
          items:
            - work_item_id: repair-redirect-chunking-full
              title: Preserve an existing chunked framing header
              objective: Enable chunked output for body-capable methods when Transfer-Encoding is absent or already chunked
              dependencies: []
              expected_artifacts: [tornado/http1connection.py, tornado-redirect-put-without-body-full receipt]
              acceptance_ids: [tornado-redirect-put-without-body-full]
              allowed_tools: [retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: tornado/http1connection.py
          old: '                and "Transfer-Encoding" not in headers'
          new: '                and ("Transfer-Encoding" not in headers or (self.is_client and headers["Transfer-Encoding"] == "chunked"))'
          expected_occurrences: 2
      - tool: submit
        arguments:
          summary: Preserved existing chunked framing across redirected PUT requests and ran the protected regression check.
