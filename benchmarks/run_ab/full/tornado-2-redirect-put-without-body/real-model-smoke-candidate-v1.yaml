    path: /pilot-source
    base_commit: 2ca8821d006f6693f920a4b183a3a7c985a5c8ad
  constraints:
    allowed_paths: [tornado/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    allowed_tools: [read_file, retrieve_code, replace_text, run_check]
    network: deny
    requirements:
      - Do not change tests, dependencies, public APIs, or server-side framing behavior.
      - Use revision-bound repository evidence before editing the production package.
      - Preserve fixed-length, non-chunked, and bodyless method behavior.
  acceptance:
    - id: tornado-redirect-put-without-body-smoke-candidate
      command: >-
        python -B -c "import ast; from pathlib import Path; from types import SimpleNamespace; tree=ast.parse(Path('tornado/http1connection.py').read_text(encoding='utf-8')); klass=next(item for item in tree.body if isinstance(item,ast.ClassDef) and item.name=='HTTP1Connection'); method=next(item for item in klass.body if isinstance(item,ast.FunctionDef) and item.name=='write_headers'); branch=next(item for item in method.body if isinstance(item,ast.If) and isinstance(item.test,ast.Attribute) and item.test.attr=='is_client'); pick=lambda body:next(item for item in body if isinstance(item,ast.Assign) and any(isinstance(target,ast.Attribute) and target.attr=='_chunking_output' for target in item.targets)); expressions=[compile(ast.Expression(pick(body).value),'tornado/http1connection.py','eval') for body in (branch.body,branch.orelse)]; evaluate=lambda expression,self_obj,start_line,headers:eval(expression,{}, {'self':self_obj,'start_line':start_line,'headers':headers}); client=SimpleNamespace(is_client=True); request=lambda method:SimpleNamespace(method=method); assert evaluate(expressions[0],client,request('PUT'),{'Transfer-Encoding':'chunked'}) is True; assert evaluate(expressions[0],client,request('PUT'),{'Transfer-Encoding':'gzip'}) is False; assert evaluate(expressions[0],client,request('PUT'),{'Content-Length':'0'}) is False; assert evaluate(expressions[0],client,request('GET'),{}) is False; server=SimpleNamespace(is_client=False,_request_start_line=SimpleNamespace(version='HTTP/1.1')); assert evaluate(expressions[1],server,SimpleNamespace(code=200),{'Transfer-Encoding':'chunked'}) is False"
