schema_version: 1
benchmark_id: sanic-2-asyncio-start-serving-full
fixture_path: fixture

task:
  task_id: sanic-asyncio-start-serving-full
  title: Proxy asyncio server lifecycle methods
  objective: Expose start_serving and serve_forever through the AsyncioServer wrapper
  repository:
    source: local
    path: /fixture
    base_commit: ba9b432993019b0af0c4827a5ed42aaa091bd17d
  constraints:
    allowed_paths: ["**"]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: sanic-asyncio-start-serving-full
      command: >-
        python -B -c "import ast; from pathlib import Path; from types import SimpleNamespace; source=Path('sanic/server.py').read_text(encoding='utf-8'); tree=ast.parse(source); klass=next(item for item in tree.body if isinstance(item,ast.ClassDef) and item.name=='AsyncioServer'); methods={item.name:item for item in klass.body if isinstance(item,ast.FunctionDef)}; assert {'start_serving','serve_forever'}<=methods.keys(),methods.keys(); assert all('except AttributeError' in ast.unparse(methods[name]) and 'raise NotImplementedError' in ast.unparse(methods[name]) for name in ('start_serving','serve_forever')); namespace={}; exec(compile(ast.Module(body=[methods['start_serving'],methods['serve_forever']],type_ignores=[]),'sanic/server.py','exec'),namespace); calls=[]; server=SimpleNamespace(start_serving=lambda:calls.append('start') or 'started',serve_forever=lambda:calls.append('forever') or 'serving'); owner=SimpleNamespace(server=server); assert namespace['start_serving'](owner)=='started'; assert namespace['serve_forever'](owner)=='serving'; assert calls==['start','forever'],calls"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 12
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: locate-asyncio-server-proxy-full
      title: Locate asyncio server lifecycle proxy behavior
      objective: Retrieve revision-bound evidence before extending the wrapper
      dependencies: []
      expected_artifacts: [Code EvidencePack, sanic-asyncio-start-serving-full receipt]
      acceptance_ids: [sanic-asyncio-start-serving-full]
      allowed_tools: [retrieve_code]

expected_initial_failed_checks: [sanic-asyncio-start-serving-full]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source retrieval until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &retrieve_target
        tool: retrieve_code
        arguments:
          query: AsyncioServer start_serving serve_forever server
          max_chunks: 8
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with the bounded upstream wrapper methods.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-asyncio-server-proxy-full]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target
      - tool: revise_plan
        arguments:
          reason: Repeated retrieval produced no new evidence; proxy both asyncio lifecycle methods.
          items:
            - work_item_id: repair-asyncio-server-proxy-full
              title: Add bounded asyncio lifecycle proxies
              objective: Delegate start_serving and serve_forever while preserving unsupported-runtime errors
              dependencies: []
              expected_artifacts: [sanic/server.py, sanic-asyncio-start-serving-full receipt]
              acceptance_ids: [sanic-asyncio-start-serving-full]
              allowed_tools: [retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: sanic/server.py
          old: "    def __await__(self):"
          new: "    def start_serving(self):\n        if self.server:\n            try:\n                return self.server.start_serving()\n            except AttributeError:\n                raise NotImplementedError(\n                    \"server.start_serving not available in this version \"\n                    \"of asyncio or uvloop.\"\n                )\n\n    def serve_forever(self):\n        if self.server:\n            try:\n                return self.server.serve_forever()\n            except AttributeError:\n                raise NotImplementedError(\n                    \"server.serve_forever not available in this version \"\n                    \"of asyncio or uvloop.\"\n                )\n\n    def __await__(self):"
      - tool: submit
        arguments:
          summary: Added bounded asyncio lifecycle proxies and ran the protected delegation regression check.
