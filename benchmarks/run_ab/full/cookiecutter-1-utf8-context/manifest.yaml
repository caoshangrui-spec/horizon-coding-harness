schema_version: 1
benchmark_id: cookiecutter-1-utf8-context-full
fixture_path: fixture

task:
  task_id: cookiecutter-utf8-context-full
  title: Decode non-ASCII context values in the full upstream checkout
  objective: Load context JSON as UTF-8 even when the platform default encoding is ASCII
  repository:
    source: local
    path: /fixture
    base_commit: c15633745df6abdb24e02746b82aadb20b8cdf8c
  constraints:
    allowed_paths: ["**"]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: cookiecutter-utf8-full
      command: >-
        python -B -c "import ast,builtins,json,os,pathlib,tempfile,types; from collections import OrderedDict; source=pathlib.Path('cookiecutter/generate.py').read_text(encoding='utf-8'); tree=ast.parse(source); node=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='generate_context'); namespace={'OrderedDict':OrderedDict,'json':json,'os':os,'ContextDecodingException':ValueError,'apply_overwrites_to_context':lambda *args:None,'logger':types.SimpleNamespace(debug=lambda *args:None)}; exec(compile(ast.fix_missing_locations(ast.Module(body=[node],type_ignores=[])),'cookiecutter/generate.py','exec'),namespace); path=pathlib.Path(tempfile.gettempdir())/'horizon-cookiecutter-non-ascii.json'; path.write_bytes(json.dumps({'full_name':'éèà'},ensure_ascii=False).encode('utf-8')); real_open=builtins.open; builtins.open=lambda file,mode='r',*args,**kwargs:real_open(file,mode,*args,**(kwargs if 'b' in mode or 'encoding' in kwargs else dict(kwargs,encoding='ascii'))); observed=namespace['generate_context'](str(path)); assert observed==OrderedDict([('horizon-cookiecutter-non-ascii',OrderedDict([('full_name','éèà')]))])"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 10
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: locate-context-loader-full
      title: Locate context decoding in the upstream checkout
      objective: Retrieve revision-bound evidence before changing the file encoding
      dependencies: []
      expected_artifacts: [Code EvidencePack, cookiecutter-utf8-full receipt]
      acceptance_ids: [cookiecutter-utf8-full]
      allowed_tools: [retrieve_code]

expected_initial_failed_checks: [cookiecutter-utf8-full]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source retrieval until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &retrieve_target
        tool: retrieve_code
        arguments:
          query: generate_context context_file json encoding open
          max_chunks: 4
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with the bounded upstream UTF-8 repair.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-context-loader-full]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target
      - tool: revise_plan
        arguments:
          reason: Repeated retrieval produced no new evidence; bind the context read to UTF-8 as upstream did.
          items:
            - work_item_id: repair-context-loader-full
              title: Bind context reads to UTF-8
              objective: Make non-ASCII JSON decoding independent of the platform default
              dependencies: []
              expected_artifacts: [Code EvidencePack, cookiecutter-utf8-full receipt]
              acceptance_ids: [cookiecutter-utf8-full]
              allowed_tools: [retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: cookiecutter/generate.py
          old: "with open(context_file) as file_handle:"
          new: "with open(context_file, encoding='utf-8') as file_handle:"
      - tool: submit
        arguments:
          summary: Bound context JSON decoding to UTF-8 and ran the protected regression check.
