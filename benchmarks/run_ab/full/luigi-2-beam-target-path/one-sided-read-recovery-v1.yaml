schema_version: 1
benchmark_id: luigi-2-one-sided-read-recovery-v1
fixture_path: fixture

# Post-run development regression derived from paid Run
# run_940f6a82909a444f82b58c142191b716. This is not a holdout or real-model result.
task:
  task_id: luigi-one-sided-read-recovery-v1
  title: Recover a one-sided Beam target-path read
  objective: Read project, dataset, and table identifiers from the BigQuery target table object
  repository:
    source: local
    path: /fixture
    base_commit: baa54c9f4f809692d62d4c3e4497161717c76550
  constraints:
    allowed_paths: [luigi/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    allowed_tools: [read_file, retrieve_code, replace_text, run_check]
    network: deny
    requirements:
      - Preserve LocalTarget and GCSTarget behavior and change only the production package.
  acceptance:
    - id: luigi-one-sided-read-recovery
      command: >-
        python -B -c "import ast; from pathlib import Path; from types import SimpleNamespace; tree=ast.parse(Path('luigi/contrib/beam_dataflow.py').read_text(encoding='utf-8')); klass=next(item for item in tree.body if isinstance(item,ast.ClassDef) and item.name=='BeamDataflowJobTask'); fn=next(item for item in klass.body if isinstance(item,ast.FunctionDef) and item.name=='get_target_path'); fn.decorator_list=[]; Target=type('Target',(),{}); LocalTarget=type('LocalTarget',(Target,),{}); GCSTarget=type('GCSTarget',(Target,),{}); BigQueryTarget=type('BigQueryTarget',(Target,),{}); namespace={'luigi':SimpleNamespace(Target=Target,LocalTarget=LocalTarget),'gcs':SimpleNamespace(GCSTarget=GCSTarget),'bigquery':SimpleNamespace(BigQueryTarget=BigQueryTarget)}; exec(compile(ast.Module(body=[fn],type_ignores=[]),'luigi/contrib/beam_dataflow.py','exec'),namespace); target=BigQueryTarget(); target.table=SimpleNamespace(project_id='p',dataset_id='d',table_id='t'); assert namespace['get_target_path'](target)=='p:d.t'"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 12
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1
  memory_scope: luigi-one-sided-read-recovery-v1

initial_plan:
  version: 1
  items:
    - work_item_id: inspect-observed-beam-range
      title: Inspect the observed Beam target-path evidence
      objective: Reuse the paid-Run query and inspect its one-sided bounded source window
      dependencies: []
      expected_artifacts: [Code EvidencePack, bounded luigi/contrib/beam_dataflow.py excerpt]
      acceptance_ids: [luigi-one-sided-read-recovery]
      allowed_tools: [retrieve_code, read_file]

expected_initial_failed_checks: [luigi-one-sided-read-recovery]

arms:
  - arm_id: repeated-retrieval
    role: baseline
    description: Repeat the observed query until deterministic no-progress guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &observed_query
        tool: retrieve_code
        arguments:
          query: beam_dataflow.py BigQuery target path
      - *observed_query
      - *observed_query
      - *observed_query

  - arm_id: complete-range-and-repair
    role: single_replan
    description: Complete the observed one-sided range, then edit and validate the target path.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-beam-target-path-after-one-sided-read]
    expected_model_calls: 5
    expected_tool_calls: 6
    expected_steps: 6
    actions:
      - *observed_query
      - tool: read_file
        arguments:
          path: luigi/contrib/beam_dataflow.py
          start_line: 440
      - tool: revise_plan
        arguments:
          reason: The completed bounded window exposes get_target_path and the missing nested table access.
          items:
            - work_item_id: repair-beam-target-path-after-one-sided-read
              title: Read the BigQuery table identity
              objective: Format the Beam output path from the nested BigQuery table object
              dependencies: []
              expected_artifacts: [luigi/contrib/beam_dataflow.py, luigi-one-sided-read-recovery receipt]
              acceptance_ids: [luigi-one-sided-read-recovery]
              allowed_tools: [read_file, retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: luigi/contrib/beam_dataflow.py
          old: '            "{}:{}.{}".format(target.project_id, target.dataset_id, target.table_id)'
          new: '            return "{}:{}.{}".format(target.table.project_id, target.table.dataset_id, target.table.table_id)'
      - tool: submit
        arguments:
          summary: Completed the one-sided read, repaired nested BigQuery identifiers, and validated the target path.
