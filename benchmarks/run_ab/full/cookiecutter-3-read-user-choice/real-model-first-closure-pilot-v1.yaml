  task_id: cookiecutter-read-user-choice-first-closure-v1
  title: Avoid rendering choice values twice
  objective: Keep Cookiecutter's numbered prompt while preventing Click from appending its own choice list.
  repository:
    source: local
    path: /pilot-source
    base_commit: 5c282f020a8db7e5e7c4e7b51b010556ca31fb7f
  constraints:
    allowed_paths: [cookiecutter/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    allowed_tools: [read_file, retrieve_code, replace_text, run_check]
    network: deny
    requirements:
      - Do not change tests, dependencies, or unrelated prompt functions.
      - Use revision-bound repository evidence before editing the production package.
      - Preserve Cookiecutter's numbered prompt text, default selection, and selected return value.
  acceptance:
    - id: cookiecutter-read-user-choice-first-closure-v1
      command: >-
        python -B -c "import ast; from pathlib import Path; from collections import OrderedDict; from types import SimpleNamespace; tree=ast.parse(Path('cookiecutter/prompt.py').read_text(encoding='utf-8')); fn=next(item for item in tree.body if isinstance(item,ast.FunctionDef) and item.name=='read_user_choice'); calls=[]; click=SimpleNamespace(Choice=lambda choices: tuple(choices),prompt=lambda prompt,**kwargs: (calls.append((prompt,kwargs)) or '1')); namespace={'OrderedDict':OrderedDict,'click':click}; exec(compile(ast.Module(body=[fn],type_ignores=[]),'cookiecutter/prompt.py','exec'),namespace); assert namespace['read_user_choice']('varname',['hello','world'])=='hello'; assert calls[-1][1].get('show_choices') is False,calls[-1]"
      timeout_seconds: 30
      required: true
