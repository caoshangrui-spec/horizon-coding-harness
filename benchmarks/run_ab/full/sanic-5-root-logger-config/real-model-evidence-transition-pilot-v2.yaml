task:
  schema_version: "1.0"
  spec_version: 1
  task_id: sanic-root-logger-config-evidence-transition-v2
  title: Keep framework defaults in the Sanic logger namespace
  objective: Avoid applying Sanic's default handler and level to the generic root logger name.
  repository:
    source: local
    path: /pilot-source
    base_commit: e3a27c2cc485d57aa1ff87d9f69098e4ab12727e
  constraints:
    allowed_paths: [sanic/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    allowed_tools: [read_file, retrieve_code, replace_text, run_check]
    network: deny
    requirements:
      - Do not change tests, dependencies, public APIs, or unrelated logger configuration.
      - Use revision-bound repository evidence before editing the production package.
      - Preserve the existing access and error logger defaults.
  acceptance:
    - id: sanic-root-logger-config-evidence-transition-v2
      command: >-
        python -B -c "import ast,sys; from pathlib import Path; tree=ast.parse(Path('sanic/log.py').read_text(encoding='utf-8')); assignment=next(item for item in tree.body if isinstance(item,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='LOGGING_CONFIG_DEFAULTS' for target in item.targets)); namespace={'sys':sys}; exec(compile(ast.Module(body=[assignment],type_ignores=[]),'sanic/log.py','exec'),namespace); loggers=namespace['LOGGING_CONFIG_DEFAULTS']['loggers']; assert 'sanic.root' in loggers,loggers; assert 'root' not in loggers,loggers; assert loggers['sanic.root']['handlers']==['console'] and loggers['sanic.root']['level']=='INFO'"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 24
    max_model_calls: 14
    max_tool_calls: 24
    max_wall_time_seconds: 900
    max_cost_usd: "0.180"
    max_input_tokens: 120000
    max_output_tokens: 4096
