schema_version: 1
benchmark_id: luigi-7-status-wont-override-full
fixture_path: fixture

task:
  task_id: luigi-status-wont-override-full
  title: Protect running task status from another worker
  objective: Allow terminal updates only from the worker actually running a task and reject unrelated status overrides
  repository:
    source: local
    path: /fixture
    base_commit: dd1f2ce0061e7787166522a3c75339ba4755dd2c
  constraints:
    allowed_paths: ["**"]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: luigi-status-wont-override-full
      command: >-
        python -B -c "import ast; from pathlib import Path; from types import SimpleNamespace; tree=ast.parse(Path('luigi/scheduler.py').read_text(encoding='utf-8')); cls=next(x for x in tree.body if isinstance(x,ast.ClassDef) and x.name=='Scheduler'); method=next(x for x in cls.body if isinstance(x,ast.FunctionDef) and x.name=='add_task'); branch=next(x for x in ast.walk(method) if isinstance(x,ast.If) and 'task.status in (RUNNING, BATCH_RUNNING)' in ast.unparse(x.test) and 'new_deps' in ast.unparse(x.test)); predicate=compile(ast.Expression(branch.test),'luigi/scheduler.py','eval'); decide=lambda current,status,owner,worker,new_deps=None:bool(eval(predicate,{'RUNNING':'RUNNING','BATCH_RUNNING':'BATCH_RUNNING','PENDING':'PENDING','DONE':'DONE','FAILED':'FAILED'},{'task':SimpleNamespace(status=current,worker_running=owner),'status':status,'worker_id':worker,'new_deps':new_deps})); assert decide('RUNNING','UNKNOWN','X','Y') is False; assert decide('RUNNING','DONE','X','X') is True; assert decide('RUNNING','FAILED','X','X') is True; assert decide('RUNNING','DONE','X','Y') is False; assert decide('PENDING','UNKNOWN',None,'Y') is True; assert decide('RUNNING','UNKNOWN','X','Y',{'dep'}) is True"
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 16
    max_model_calls: 12
    max_tool_calls: 16
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: locate-status-wont-override-full
      title: Locate running task status transitions
      objective: Retrieve revision-bound evidence before changing scheduler status ownership
      dependencies: []
      expected_artifacts: [Code EvidencePack, luigi-status-wont-override-full receipt]
      acceptance_ids: [luigi-status-wont-override-full]
      allowed_tools: [retrieve_code]

expected_initial_failed_checks: [luigi-status-wont-override-full]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source retrieval until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &retrieve_target
        tool: retrieve_code
        arguments:
          query: Scheduler add_task running status worker override
          max_chunks: 8
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with bounded running-task ownership checks.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-status-wont-override-full]
    expected_model_calls: 7
    expected_tool_calls: 8
    expected_steps: 8
    actions:
      - *retrieve_target
      - *retrieve_target
      - *retrieve_target
      - tool: revise_plan
        arguments:
          reason: Repeated retrieval produced no new evidence; gate running-task updates by terminal status and worker ownership.
          items:
            - work_item_id: repair-status-wont-override-full
              title: Protect running task status ownership
              objective: Accept terminal updates only from the running worker while preserving dependency updates
              dependencies: []
              expected_artifacts: [luigi/scheduler.py, luigi-status-wont-override-full receipt]
              acceptance_ids: [luigi-status-wont-override-full]
              allowed_tools: [retrieve_code, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: luigi/scheduler.py
          old: '        if not (task.status in (RUNNING, BATCH_RUNNING) and status == PENDING) or new_deps:'
          new: '        if not (task.status in (RUNNING, BATCH_RUNNING) and (status not in (DONE, FAILED, RUNNING) or task.worker_running != worker_id)) or new_deps:'
      - tool: replace_text
        arguments:
          path: luigi/scheduler.py
          old: "            # don't allow re-scheduling of task while it is running, it must either fail or succeed first"
          new: "            # don't allow re-scheduling of task while it is running, it must either fail or succeed on the worker actually running it"
      - tool: submit
        arguments:
          summary: Bound running-task status changes to the owning worker and ran the protected scheduler regression check.
