schema_version: 1
benchmark_id: tornado-1-websocket-nodelay
fixture_path: fixture

task:
  task_id: tornado-websocket-nodelay
  title: Route WebSocket nodelay through the active protocol connection
  objective: Expose protocol-level nodelay and delegate it to the underlying stream
  repository:
    source: local
    path: /fixture
    base_commit: 6a5a0bfa370b6c0d3dbbf9589a560a98202d2baa
  constraints:
    allowed_paths: [tornado/**, tests/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: tornado-websocket-nodelay
      command: python -B tests/test_websocket_nodelay.py
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 10
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: inspect-websocket-nodelay
      title: Inspect WebSocket nodelay delegation
      objective: Establish evidence before changing the connection abstraction
      dependencies: []
      expected_artifacts: [tornado/websocket.py, tornado-websocket-nodelay receipt]
      acceptance_ids: [tornado-websocket-nodelay]
      allowed_tools: [read_file]

expected_initial_failed_checks: [tornado-websocket-nodelay]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source read until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &read_target
        tool: read_file
        arguments: {path: tornado/websocket.py}
      - *read_target
      - *read_target
      - *read_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with the bounded upstream delegation repair.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-websocket-nodelay]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *read_target
      - *read_target
      - *read_target
      - tool: revise_plan
        arguments:
          reason: Repeated reads produced no new evidence; route nodelay through the protocol.
          items:
            - work_item_id: repair-websocket-nodelay
              title: Delegate nodelay through the protocol
              objective: Make the active WebSocket connection own transport nodelay
              dependencies: []
              expected_artifacts: [tornado/websocket.py, tornado-websocket-nodelay receipt]
              acceptance_ids: [tornado-websocket-nodelay]
              allowed_tools: [read_file, apply_patch, run_check]
      - tool: apply_patch
        arguments:
          edits:
            - path: tornado/websocket.py
              old: |-
                class WebSocketHandler:
                    def __init__(self, stream, ws_connection):
                        self.stream = stream
                        self.ws_connection = ws_connection

                    def set_nodelay(self, value: bool) -> None:
                        assert self.stream is not None
                        self.stream.set_nodelay(value)


                class WebSocketProtocol(abc.ABC):
                    @abc.abstractmethod
                    def start_pinging(self) -> None:
                        raise NotImplementedError()


                class WebSocketProtocol13(WebSocketProtocol):
                    def __init__(self, stream):
                        self.stream = stream

                    def start_pinging(self) -> None:
                        pass


                class WebSocketClientConnection:
                    pass
              new: |-
                class WebSocketHandler:
                    def __init__(self, stream, ws_connection):
                        self.stream = stream
                        self.ws_connection = ws_connection

                    def set_nodelay(self, value: bool) -> None:
                        assert self.ws_connection is not None
                        self.ws_connection.set_nodelay(value)


                class WebSocketProtocol(abc.ABC):
                    @abc.abstractmethod
                    def start_pinging(self) -> None:
                        raise NotImplementedError()

                    @abc.abstractmethod
                    def set_nodelay(self, x: bool) -> None:
                        raise NotImplementedError()


                class WebSocketProtocol13(WebSocketProtocol):
                    def __init__(self, stream):
                        self.stream = stream

                    def start_pinging(self) -> None:
                        pass

                    def set_nodelay(self, x: bool) -> None:
                        self.stream.set_nodelay(x)


                class WebSocketClientConnection:
                    pass
      - tool: submit
        arguments:
          summary: Routed nodelay through the protocol and ran the protected regression check.
