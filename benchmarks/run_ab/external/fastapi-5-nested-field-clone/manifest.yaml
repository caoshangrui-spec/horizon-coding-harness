schema_version: 1
benchmark_id: fastapi-5-nested-field-clone
fixture_path: fixture

task:
  task_id: fastapi-nested-field-clone
  title: Recursively clone nested response fields
  objective: Prevent a cloned response model from retaining aliases to nested source fields
  repository:
    source: local
    path: /fixture
    base_commit: 7cea84b74ca3106a7f861b774e9d215e5228728f
  constraints:
    allowed_paths: [fastapi/**, tests/**]
    denied_paths: [.git/**, .env, .env.*, secrets/**]
    network: deny
  acceptance:
    - id: fastapi-nested-clone
      command: python -B tests/test_nested_clone.py
      timeout_seconds: 30
      required: true
  budgets:
    max_steps: 20
    max_model_calls: 10
    max_tool_calls: 20
    max_wall_time_seconds: 600
    max_cost_usd: "1.00"
    max_input_tokens: 100000
    max_output_tokens: 5000
    max_repair_cycles: 2
  task_kind: bugfix
  execution_mode: workspace_write
  authority_scope: workspace_write
  model_policy_id: offline-scripted-v1

initial_plan:
  version: 1
  items:
    - work_item_id: inspect-field-clone
      title: Inspect nested field cloning
      objective: Establish evidence before changing the clone recursion
      dependencies: []
      expected_artifacts: [fastapi/utils.py, fastapi-nested-clone receipt]
      acceptance_ids: [fastapi-nested-clone]
      allowed_tools: [read_file]

expected_initial_failed_checks: [fastapi-nested-clone]

arms:
  - arm_id: no-replan
    role: baseline
    description: Continue the stalled source read until deterministic guidance is required.
    expected_status: WAITING_FOR_USER
    expected_plan_version: 1
    expected_execution_replans: 0
    expected_passed_items: []
    expected_human_request_pattern: identical_action
    expected_model_calls: 4
    expected_tool_calls: 4
    expected_steps: 4
    actions:
      - &read_target
        tool: read_file
        arguments: {path: fastapi/utils.py}
      - *read_target
      - *read_target
      - *read_target

  - arm_id: single-replan
    role: single_replan
    description: Replace the stalled investigation with the bounded upstream recursive clone repair.
    expected_status: SUCCEEDED
    expected_plan_version: 2
    expected_execution_replans: 1
    expected_passed_items: [repair-field-clone]
    expected_model_calls: 6
    expected_tool_calls: 7
    expected_steps: 7
    actions:
      - *read_target
      - *read_target
      - *read_target
      - tool: revise_plan
        arguments:
          reason: Repeated reads produced no new evidence; recursively clone the nested field.
          items:
            - work_item_id: repair-field-clone
              title: Recursively clone nested fields
              objective: Remove nested aliases from the cloned response-field graph
              dependencies: []
              expected_artifacts: [fastapi/utils.py, fastapi-nested-clone receipt]
              acceptance_ids: [fastapi-nested-clone]
              allowed_tools: [read_file, replace_text, run_check]
      - tool: replace_text
        arguments:
          path: fastapi/utils.py
          old: "use_type.__fields__[f.name] = f"
          new: "use_type.__fields__[f.name] = create_cloned_field(f)"
      - tool: submit
        arguments:
          summary: Recursively cloned nested response fields and ran the protected regression check.
