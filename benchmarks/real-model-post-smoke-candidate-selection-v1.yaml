limitations:
  - This is a post-hoc development follow-up and must not be added to the frozen five-task Smoke aggregate.
  - All repair shapes and target paths are evaluator-known; this is not blind or holdout selection.
  - The model is stateless across Runs, but both surviving projects appeared in earlier distinct paid tasks.
  - Local planning costs and report refs contain the local absolute source path and may differ on Linux.
  - The first elevated Sanic preflight was rejected by Windows Git ownership handling; the successful rerun used a process-scoped exact safe.directory and made no global Git change.
  - Preflight readiness is capacity evidence only and does not authorize a paid Run or predict success.
