selection_reason: >-
  Neither remaining task satisfies both evidence gates needed for another paid attempt.
  HTTPie-1 has rank-1 target visibility for the frozen base and English paraphrase queries,
  but its known repair needs five coordinated replacements and none of the three failure-derived
  Harness changes de-risks multi-edit execution. Tornado-2 has one bounded replacement call, but
  the target path is rank 3 in the frozen baseline and ranks 7, 2, 8, and 4 across the frozen hard
  query variants, outside retrieve_code's default rank-1 delivery. A new paid attempt would
  therefore be budget trial-and-error rather than a falsifiable test of a repaired precursor.

