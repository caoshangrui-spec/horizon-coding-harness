limitations:
  - The two remaining tasks and all scripted repairs are author-known development cases, not holdout evidence.
  - Local preflight report refs and planning costs include the local absolute source path and may differ on Linux.
  - Frozen retrieval queries are evaluator-authored and do not predict a future model-generated query.
  - Preflight readiness proves bounded launch capacity only; it is not a success forecast or spending authority.
  - The Sanic regression is a synthetic 8K-context interaction test, not an exact-checkout paid Run replay.
  - Abstention does not establish that either remaining task is unsolvable or that the Harness generalizes.
