diagnosis:
  failure_class: context_compacted_read_only_loop_then_campaign_limit
  facts:
    - The first execution response requested retrieval plus a full read of cookiecutter/prompt.py; the successful read exposed read_user_choice and the faulty click.prompt call.
    - Six later model requests used deterministic context compaction. The model repeated whole-file or tail reads instead of calling replace_text, and NoProgressPolicy rejected the third identical whole-file read.
    - The final settled execution response retrieved cookiecutter/prompt.py lines 71-110 at rank 1, exposing the exact target call without truncation.
    - No subsequent model request was dispatched: after eight settled calls the Campaign had CNY 0.0540828 remaining, below the next conservative reservation of CNY 0.076338.
    - There was no replace_text, run_check, workspace revision change, or protected validation.
  limitations:
    - The run proves correct-location exposure, not that the model inferred or proposed the correct edit.
    - The settled cost is a frozen local price-card estimate, not a provider invoice.
    - No protected validation ran, so its outcome remains unknown rather than false.
    - This post-hoc development result is not part of the original five-task Smoke denominator.
