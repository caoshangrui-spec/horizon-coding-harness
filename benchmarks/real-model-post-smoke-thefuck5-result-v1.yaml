diagnosis:
  failure_class: line_ending_sensitive_exact_replace_then_read_only_loop_and_campaign_limit
  facts:
    - The first execution call read the correct production file and exposed the faulty predicate.
    - The next model response proposed replace_text against the correct function, but its multiline old/new fragments used LF while the exact checkout file used uniform CRLF.
    - The exact replacement therefore observed zero occurrences and had no effect; the candidate was never applied or protected-validated, so it is not valid edit evidence.
    - The model then returned to repeated reads and retrieval. NoProgressPolicy rejected two reads and EvidenceTransitionPolicy rejected one retrieval plus two reads, but no second write or run_check followed.
    - The thirteenth settled model call left CNY 0.0584280 available; the next call required a CNY 0.076038 conservative reservation and was stopped before Provider dispatch.
  limitations:
    - The proposed predicate change targeted the correct behavior, but because it was never applied, protected validation cannot establish semantic correctness.
    - The settled cost is a frozen local price-card estimate, not a provider invoice.
    - No protected validation ran, so its outcome remains unknown rather than false.
    - This post-hoc development result is not part of the original five-task Smoke denominator.
