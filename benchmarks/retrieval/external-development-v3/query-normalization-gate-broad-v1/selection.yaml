schema_version: 1
suite_id: external-development-query-normalization-gate-broad-v1
selected_at: "2026-10-24"
partition: development
relationship_to_gate_design: out-of-design cases with post-design frozen queries
base_development_suite: ../development-suite.yaml
gate_design_suite: ../query-normalization-gate-v1/selection.yaml
holdout_status: sealed

protocol:
  purpose: Measure gate contract behavior and paired lexical retrieval on the 12 development cases not used to design the selective gate.
  query_rule: Derive raw identifiers and English paraphrases from frozen failing-test labels, add one ordinary English sentence containing the bare word test, and add one Chinese description without using source paths, source code, patches, or gold paths.
  paired_rule: Each manifest contains raw and Chinese baseline/selective pairs plus single shared observations for the two exact-bypass English variants.
  gate_positive_variants: [raw_identifier, chinese_description]
  gate_negative_variants: [english_paraphrase, bare_test_sentence]
  interpretation: Out-of-design by base case, but still authored and evaluated on the revealed development partition; this is not an independent holdout.

implementation:
  module: src/horizon/adapters/retrieval/query_normalization.py
  function: normalize_retrieval_query_selectively
  gate_function: retrieval_query_normalization_gate
  external_model_or_service_during_evaluation: false

