    query: serialize tuple parameter
    expected_paths: [luigi/parameter.py]
    max_chunks: 8
  - case_id: luigi-3-bare-test-bypass
    query: tuple parameter serialization test failure
    expected_paths: [luigi/parameter.py]
    max_chunks: 8
  - case_id: luigi-3-chinese-baseline
    query: 元组参数序列化失败
    expected_paths: [luigi/parameter.py]
    max_chunks: 8
  - case_id: luigi-3-chinese-selective
    query: failure
    expected_paths: [luigi/parameter.py]
    max_chunks: 8
