schema_version: 1
benchmark_id: sanic-5-query-normalization-gate-broad-v1
allowed_paths: [sanic/**]
denied_paths: [.git/**, .env, .env.*, secrets/**, "**/test/**", "**/tests/**"]
cases:
  - case_id: sanic-5-raw-baseline
    query: test_logging_modified_root_logger_config
    expected_paths: [sanic/log.py]
    max_chunks: 8
  - case_id: sanic-5-raw-selective
    query: loggingModifiedRootLoggerConfig logging modified root logger config
    expected_paths: [sanic/log.py]
    max_chunks: 8
  - case_id: sanic-5-english-bypass
    query: logging modified root logger config
    expected_paths: [sanic/log.py]
    max_chunks: 8
  - case_id: sanic-5-bare-test-bypass
    query: logging test modifies the root logger config
    expected_paths: [sanic/log.py]
    max_chunks: 8
  - case_id: sanic-5-chinese-baseline
    query: 日志测试修改根日志配置失败
    expected_paths: [sanic/log.py]
    max_chunks: 8
  - case_id: sanic-5-chinese-selective
    query: failure
    expected_paths: [sanic/log.py]
    max_chunks: 8
