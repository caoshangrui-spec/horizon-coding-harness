negative_results:
  - The selective arm does not change Hit@8 or path Recall@8: both remain 39/48 despite 24 gate activations.
  - Chinese Hit@8 remains 3/12 and MRR remains 0.194444. Three previously empty Chinese queries become non-empty misses after collapsing to generic terms such as failure or override, so fewer empty results do not mean better localization.
  - Six Chinese treatments collapse to the single term failure; the small glossary improvement observed on the four gate-design cases does not generalize to these 12 out-of-design development cases.
  - Raw test-identifier normalization improves two ranks from 3 to 2, has no rank regressions, and raises raw MRR only from 0.833333 to 0.861111.
  - Both Luigi groups remain degraded because unsupported source files are skipped; this result still does not cover real Agent-generated queries or independent holdout cases.

decision:
  combined_gate_runtime_policy: not_integrated
  identifier_branch: promising_but_experimental
  cjk_branch: blocked_by_glossary_coverage
  statement: Do not expose the combined gate in the Agent runtime. Next evaluate a conservative CJK strategy that preserves the original query and adds mapped terms only when coverage is sufficient; keep structured test-identifier normalization as a separate candidate.
