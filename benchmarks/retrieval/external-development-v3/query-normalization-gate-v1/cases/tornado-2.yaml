schema_version: 1
benchmark_id: tornado-2-query-normalization-gate-v1
allowed_paths: [tornado/**]
denied_paths: [.git/**, .env, .env.*, secrets/**, "**/test/**", "**/tests/**"]
cases:
  - case_id: tornado-2-raw-identifier
    query: httpClientCommon http client common redirectPutWithoutBody redirect put without body
    expected_paths: [tornado/http1connection.py]
