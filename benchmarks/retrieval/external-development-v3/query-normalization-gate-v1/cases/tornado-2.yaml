  - case_id: tornado-2-english-paraphrase
    query: http client redirect preserves put request without body
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
  - case_id: tornado-2-failure-description
    query: redirect put without body request failure
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
  - case_id: tornado-2-chinese-description
    query: http client redirect without request body put failure
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
