negative_results:
  - Selective MRR is 0.549479, below always-on normalization at 0.653646, because bypassed English queries do not receive ranking-improving alias expansion.
  - PySnooper raw-identifier and Chinese-description queries still miss __init__.py, leaving two of 32 expected query-path observations outside the top eight.
  - Tornado failure-description still reaches its target only at rank 8, and all four Luigi observations remain degraded because source indexing skips unsupported files.
  - The gate was designed after inspecting these four development cases; it cannot establish general multilingual or Agent-generated-query quality.

decision:
  default_runtime_policy: unchanged
  statement: The selective gate restores the two English paths lost by always-on normalization and raises path Recall@8 to 30/32, but remains an opt-in development component until evaluated on a broader query set or sealed holdout.
