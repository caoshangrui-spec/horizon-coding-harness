schema_version: 1
suite_id: external-development-query-normalization-gate-v1
selected_at: "2026-10-24"
partition: development
base_query_suite: ../query-robustness-v1/selection.yaml
base_result: ../query-robustness-v1/result-v1.yaml
always_on_result: ../query-normalization-v1/result-v1.yaml
model_called: false
holdout_status: sealed

protocol:
  purpose: Test a narrow deterministic gate that keeps ordinary English queries byte-for-byte unchanged while normalizing CJK text or structured test identifiers.
  treatment_rule: Apply lexical normalization only when the query contains a CJK ideograph or an underscore/camel identifier containing explicit test or TestCase scaffolding.
  bypass_rule: All other queries preserve their original text exactly.
  leakage_rule: The gate and normalizer receive query text only; source paths, gold paths, source code, patches, repository identity, and case identity are not inputs.
  interpretation: Adaptive development A/B only. The cases, baseline failures, and always-on treatment results were known before gate design.

implementation:
  module: src/horizon/adapters/retrieval/query_normalization.py
  function: normalize_retrieval_query_selectively
  gate_function: retrieval_query_normalization_gate
  accepted_shapes: [cjk_text_v1, test_identifier_v1]
  output_limit_chars: 200
  output_limit_terms: 20
  external_model_or_service: false

cases:
  - base_case_id: cookiecutter-1-non-ascii-context
    baseline_manifest: ../query-robustness-v1/cases/cookiecutter-1.yaml
    treatment_manifest: cases/cookiecutter-1.yaml
    source_subdir: cookiecutter-1-non-ascii-context
