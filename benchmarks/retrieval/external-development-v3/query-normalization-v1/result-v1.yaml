negative_results:
  - English-paraphrase and failure-description path recall each fall from 8/8 to 7/8 because PySnooper __init__.py drops out of the top eight.
  - Tornado failure-description still reaches the target only at rank 8, and all four Luigi observations remain degraded because source indexing skips unsupported files.
  - The large Chinese gain is measured on four adaptive development queries covered by the frozen glossary; it does not establish general multilingual retrieval.

decision:
  default_runtime_policy: unchanged
  statement: Do not enable normalization for every query. Retain it as an experimental component and next test a deterministic gate limited to Chinese text or explicit test-identifier scaffolding.

