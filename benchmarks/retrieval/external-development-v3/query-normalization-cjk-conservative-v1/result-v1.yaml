negative_results:
  - The additive treatment has identical ranks, relevant-path counts, and returned paths to replacement normalization on all four high-coverage cases; preserving the original CJK text has no measured retrieval gain on this SQLite FTS slice.
  - The four high-coverage queries are the same adaptive cases used to design the glossary, so 4/4 Hit@8 cannot establish multilingual generalization.
  - The 12 low-coverage controls are exact static bypasses and were not rerun; their contribution is reused baseline evidence, not a new empirical result.
  - Luigi remains degraded because source indexing skips unsupported files, and PySnooper still misses one of five expected paths at K=8.

decision:
  conservative_cjk_branch: development_validated_candidate
  low_coverage_cjk_policy: exact_bypass
  default_runtime_policy: not_integrated
  statement: Keep the conservative function as an experimental candidate. Do not enable it in the Agent runtime or expand the glossary from these adaptive results; require evidence from naturally generated queries or a sealed evaluation before changing the default.
