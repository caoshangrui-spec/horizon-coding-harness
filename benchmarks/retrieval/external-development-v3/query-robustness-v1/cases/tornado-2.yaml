schema_version: 1
benchmark_id: tornado-2-query-robustness-v1
allowed_paths: [tornado/**]
denied_paths: [.git/**, .env, .env.*, secrets/**, "**/test/**", "**/tests/**"]
cases:
  - case_id: tornado-2-raw-identifier
    query: HTTPClientCommonTestCase test_redirect_put_without_body
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
  - case_id: tornado-2-english-paraphrase
    query: http client redirect preserves put request without body
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
  - case_id: tornado-2-failure-description
    query: redirect put without body request failure
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
  - case_id: tornado-2-chinese-description
    query: HTTP 客户端重定向无请求体的 PUT 失败
    expected_paths: [tornado/http1connection.py]
    max_chunks: 8
