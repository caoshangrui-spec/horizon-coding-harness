negative_results:
  - Pure Chinese descriptions miss three of four cases; the only hit retains Latin HTTP and PUT tokens.
  - Raw test identifiers move Luigi-7 to rank 5 and Tornado-2 to rank 7, so underscore splitting alone does not remove class/test noise.
  - PySnooper raw identifiers still cover only three of five gold paths, while both English paraphrase variants cover all five.
  - The sample was deliberately chosen from known-hard development cases and cannot estimate general multilingual or Agent-generated-query quality.
