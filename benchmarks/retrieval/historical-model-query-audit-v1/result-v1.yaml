negative_results:
  - Four of ten retrieve_code reservations retain only an arguments hash; their query text, language, and normalization outcome remain UNKNOWN.
  - The six recovered observations collapse to three query strings across only youtube-dl and tqdm, one provider, and one model.
  - The audit is retrospective and the documented queries were not prospectively selected for a distribution study.
  - No recovered query contains CJK, but the four unresolved events prevent a claim that the historical sample contains no CJK queries.
  - The audit does not rerun retrieval and adds no repair-success, recall, multilingual-generalization, or holdout evidence.
  - Local Trace payloads are gitignored; checked-in hashes and derived observations are reviewable, but the public repository alone cannot replay the private historical files.

