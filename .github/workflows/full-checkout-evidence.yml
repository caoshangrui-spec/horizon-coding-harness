name: Source-bound Docker evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-checkout-evidence.yml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v2.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v3.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v4.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v5.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v6.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v7.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v8.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v9.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v10.yaml"
      - "benchmarks/run_ab/bugsinpy-full-checkout-pilot-v11.yaml"
      - "benchmarks/run_ab/bugsinpy-multi-stage-hard-crash-v1.yaml"
      - "benchmarks/run_ab/bugsinpy-multi-stage-hard-crash-v2.yaml"
      - "benchmarks/run_ab/bugsinpy-multi-stage-pilot-v*.yaml"
      - "benchmarks/run_ab/bugsinpy-reduced-v2.yaml"
      - "benchmarks/run_ab/thefuck2-retrieval-reuse-v1.yaml"
      - "benchmarks/run_ab/external/**/manifest.yaml"
      - "benchmarks/run_ab/full/**/manifest.yaml"
      - "benchmarks/run_ab/full/**/multi-stage*.yaml"
      - "benchmarks/run_ab/full/**/retrieval-reuse*.yaml"
      - "benchmarks/run_ab/full/httpie-4-host-header-overwrite/real-model-pilot.yaml"
      - "benchmarks/run_ab/full/**/real-model-smoke-candidate-v1.yaml"
      - "benchmarks/real-model-smoke-candidate-selection-v1.yaml"
      - "config/providers/siliconflow-httpie-pilot.yaml"
      - "config/providers/siliconflow-smoke-candidate-preflight-v1.yaml"
      - "src/horizon/adapters/sandbox/**"
      - "src/horizon/application/agent_loop.py"
      - "src/horizon/application/run_ab_eval.py"
      - "src/horizon/application/pilot.py"
      - "src/horizon/application/retrieval_control.py"
      - "src/horizon/application/retrieval_lineage.py"
      - "src/horizon/application/context.py"
      - "src/horizon/application/memory.py"
      - "src/horizon/application/_run_ab_crash_worker.py"
      - "src/horizon/application/docker_created_recovery.py"
      - "src/horizon/application/_docker_created_crash_worker.py"
      - "src/horizon/application/docker_worker_crash_recovery.py"
      - "src/horizon/application/_docker_agent_worker.py"
      - "src/horizon/domain/docker_created_recovery.py"
      - "src/horizon/domain/run_evaluation.py"
      - "src/horizon/domain/pilot.py"
      - "src/horizon/interfaces/cli/app.py"
      - "tests/contract/test_docker.py"
      - "tests/fault_injection/_docker_check_worker.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-evidence:
    name: Reduced, full-checkout, multi-stage, and hard-crash suites
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Prepare exact upstream checkouts
        shell: bash
        run: |
          set -euo pipefail

          prepare_fixture() {
            local repository="$1"
            local commit="$2"
            local destination="$3"
            local expected_files="$4"

            mkdir -p "$destination"
            git -C "$destination" init --quiet
            git -C "$destination" remote add origin "$repository"
            git -C "$destination" fetch --quiet --depth 1 origin "$commit"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD

            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=all)"
            test "$(git -C "$destination" ls-files | wc -l | tr -d ' ')" = "$expected_files"
          }

          prepare_history_fixture() {
            local repository="$1"
            local commit="$2"
            local destination="$3"
            local expected_files="$4"

            mkdir -p "$(dirname "$destination")"
            git clone --quiet --filter=blob:none --no-checkout "$repository" "$destination"
            git -C "$destination" checkout --quiet --detach "$commit"

            test "$(git -C "$destination" rev-parse HEAD)" = "$commit"
            test -z "$(git -C "$destination" status --porcelain --untracked-files=all)"
            test "$(git -C "$destination" ls-files | wc -l | tr -d ' ')" = "$expected_files"
          }

          prepare_fixture \
            https://github.com/tqdm/tqdm.git \
            8cc777fe8401a05d07f2c97e65d15e4460feab88 \
            benchmarks/run_ab/full/tqdm-1-tenumerate-start/fixture \
            82
          prepare_fixture \
            https://github.com/ytdl-org/youtube-dl.git \
            f5469da9e6e259c1690c7ef54f1da1c19f65036f \
            benchmarks/run_ab/full/youtube-dl-3-unescape-html/fixture \
            872
          prepare_fixture \
            https://github.com/spotify/luigi.git \
            1164eb6b85b8a70f596dbb99452bec513e72c12e \
            benchmarks/run_ab/full/luigi-1-metrics-handler/fixture \
            382
          prepare_fixture \
            https://github.com/fastapi/fastapi.git \
            7cea84b74ca3106a7f861b774e9d215e5228728f \
            benchmarks/run_ab/full/fastapi-5-nested-field-clone/fixture \
            629
          prepare_fixture \
            https://github.com/tornadoweb/tornado.git \
            6a5a0bfa370b6c0d3dbbf9589a560a98202d2baa \
            benchmarks/run_ab/full/tornado-1-websocket-nodelay/fixture \
            301
          prepare_fixture \
            https://github.com/httpie/cli.git \
            356e0436510fee70b4071fac58be81c0a0a7db59 \
            benchmarks/run_ab/full/httpie-2-max-redirects/fixture \
            70
          prepare_fixture \
            https://github.com/nvbn/thefuck.git \
            2ced7a7f33ae0bec3ffc7a43ce95330bdf6cfcb9 \
            benchmarks/run_ab/full/thefuck-1-pip-unknown-command/fixture \
            401
          prepare_fixture \
            https://github.com/sanic-org/sanic.git \
            e7001b00747b659f7042b0534802b936ee8a53e0 \
            benchmarks/run_ab/full/sanic-1-blueprint-middleware-order/fixture \
            189
          prepare_fixture \
            https://github.com/cool-RR/PySnooper.git \
            e21a31162f4c54be693d8ca8260e42393b39abd3 \
            benchmarks/run_ab/full/pysnooper-2-custom-repr/fixture \
            25
          prepare_fixture \
            https://github.com/sanic-org/sanic.git \
            ba9b432993019b0af0c4827a5ed42aaa091bd17d \
            benchmarks/run_ab/full/sanic-2-asyncio-start-serving/fixture \
            188
          prepare_fixture \
            https://github.com/httpie/cli.git \
            8c892edd4fe700a7ca5cc733dcb4817831d253e2 \
            benchmarks/run_ab/full/httpie-4-host-header-overwrite/fixture \
            59
          prepare_fixture \
            https://github.com/spotify/luigi.git \
            a0f1db01ddab5b4b2bda3fbe58bad09a6d94a7b4 \
            benchmarks/run_ab/full/luigi-3-serialize-tuple-parameter/fixture \
            375
          prepare_fixture \
            https://github.com/sanic-org/sanic.git \
            e3a27c2cc485d57aa1ff87d9f69098e4ab12727e \
            benchmarks/run_ab/full/sanic-5-root-logger-config/fixture \
            156
          prepare_fixture \
            https://github.com/nvbn/thefuck.git \
            40ab4eb62db57627bff10cf029d29c94704086a2 \
            benchmarks/run_ab/full/thefuck-2-executable-path-separator/fixture \
            380
          prepare_fixture \
            https://github.com/spotify/luigi.git \
            baa54c9f4f809692d62d4c3e4497161717c76550 \
            benchmarks/run_ab/full/luigi-2-beam-target-path/fixture \
            382
          # These historical commits are reachable from current history but GitHub
          # rejects direct unadvertised-SHA fetches, so clone the filtered history.
          prepare_history_fixture \
            https://github.com/httpie/cli.git \
            16df8848e81eefac830f407e4b985f42b52970da \
            benchmarks/run_ab/full/httpie-5-escape-long-separator/fixture \
            15
          prepare_history_fixture \
            https://github.com/tornadoweb/tornado.git \
            2ca8821d006f6693f920a4b183a3a7c985a5c8ad \
            benchmarks/run_ab/full/tornado-2-redirect-put-without-body/fixture \
            300
          prepare_history_fixture \
            https://github.com/httpie/cli.git \
            001bda19450ad85c91345eea3cfa3991e1d492ba \
            benchmarks/run_ab/full/httpie-1-unique-download-filename/fixture \
            73
          prepare_history_fixture \
            https://github.com/tornadoweb/tornado.git \
            a8420fc681c5423d072978f00eab4d0645057d16 \
            benchmarks/run_ab/full/tornado-4-static-range-bounds/fixture \
            298
          prepare_history_fixture \
            https://github.com/sanic-org/sanic.git \
            91f6abaa81248189fbcbdf685e8bdcbb7846609f \
            benchmarks/run_ab/full/sanic-3-routes-with-host/fixture \
            188
          prepare_history_fixture \
            https://github.com/nvbn/thefuck.git \
            7c858fadb3458be829d3d43666ccb46c3ed5b8a0 \
            benchmarks/run_ab/full/thefuck-5-git-push-bitbucket/fixture \
            359
          prepare_history_fixture \
            https://github.com/spotify/luigi.git \
            dd1f2ce0061e7787166522a3c75339ba4755dd2c \
            benchmarks/run_ab/full/luigi-7-status-wont-override/fixture \
            338

      - name: Pull the validation image
        run: docker pull python:3.12-alpine

      - name: Preflight the zero-spend HTTPie real-model candidate
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/real-model-pilot-httpie-v1
          mkdir -p "$state_dir"
          uv run --locked horizon eval pilot-preflight \
            benchmarks/run_ab/full/httpie-4-host-header-overwrite/real-model-pilot.yaml \
            --image python:3.12-alpine \
            --config config/providers/siliconflow-httpie-pilot.yaml \
            --state-dir "$state_dir" \
            | tee "$state_dir/cli-result.json"
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(".horizon/real-model-pilot-httpie-v1/cli-result.json").read_text(
                  encoding="utf-8"
              )
          )
          report = result["report"]
          assert report["ready"] is True
          assert report["credential_loaded"] is False
          assert report["paid_model_called"] is False
          assert report["network_called"] is False
          assert report["initial_failure_matches"] is True
          assert result["requires_paid_confirmation"] is True
          PY

      - name: Compare the remaining zero-spend smoke candidates
        shell: bash
        run: |
          set -euo pipefail
          root=.horizon/smoke-candidate-preflight-v1
          tasks=(
            httpie-1-unique-download-filename
            luigi-2-beam-target-path
            sanic-2-asyncio-start-serving
            tornado-2-redirect-put-without-body
          )
          for task in "${tasks[@]}"; do
            state_dir="$root/$task"
            mkdir -p "$state_dir"
            uv run --locked horizon eval pilot-preflight \
              "benchmarks/run_ab/full/$task/real-model-smoke-candidate-v1.yaml" \
              --image python:3.12-alpine \
              --config config/providers/siliconflow-smoke-candidate-preflight-v1.yaml \
              --state-dir "$state_dir" \
              | tee "$state_dir/cli-result.json"
          done
          uv run --locked python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          import yaml

          root = Path(".horizon/smoke-candidate-preflight-v1")
          selection = yaml.safe_load(
              Path("benchmarks/real-model-smoke-candidate-selection-v1.yaml").read_text(
                  encoding="utf-8"
              )
          )
          expected = {
              "httpie-1-unique-download-filename",
              "luigi-2-beam-target-path",
              "sanic-2-asyncio-start-serving",
              "tornado-2-redirect-put-without-body",
          }
          selected = selection["selected_task_id"]
          if (
              selected != "luigi-2-beam-target-path"
              or selection["paid_execution_authorized"]
              or selection["external_model_called"]
              or selection["network_called_by_evaluator"]
              or {row["task_id"] for row in selection["candidates"]} != expected
          ):
              raise SystemExit("Frozen smoke-candidate selection contract drifted")

          reports = {}
          for task in sorted(expected):
              result = json.loads(
                  (root / task / "cli-result.json").read_text(encoding="utf-8")
              )
              report = result["report"]
              cumulative = Decimal(report["planning_execution_reserved_cost"])
              planning = Decimal(report["initial_planning_reserved_cost"])
              execution = Decimal(report["bounded_execution_reserved_cost"])
              if (
                  not report["ready"]
                  or not report["full_checkout_verified"]
                  or not report["initial_failure_matches"]
                  or not report["source_unchanged"]
                  or not report["solution_isolation_passed"]
                  or not report["planning_execution_fits_run_cap"]
                  or not report["planning_execution_fits_campaign"]
                  or report["credential_loaded"]
                  or report["paid_model_called"]
                  or report["network_called"]
                  or cumulative != planning + execution
                  or cumulative > Decimal(report["run_cost_cap"])
                  or cumulative > Decimal(report["campaign_remaining_cost"])
                  or not result["requires_paid_confirmation"]
              ):
                  raise SystemExit(f"Zero-spend candidate preflight failed: {task}")
              reports[task] = {
                  "report_ref": result["report_ref"],
                  "planning_reserved_cost_cny": report["initial_planning_reserved_cost"],
                  "bounded_execution_reserved_cost_cny": report[
                      "bounded_execution_reserved_cost"
                  ],
                  "planning_execution_reserved_cost_cny": report[
                      "planning_execution_reserved_cost"
                  ],
                  "ready": report["ready"],
              }

          evidence = {
              "schema_version": 1,
              "claim_scope": selection["claim_scope"],
              "candidate_count": len(reports),
              "selected_task_id": selected,
              "all_exact_checkout_preflights_ready": True,
              "cumulative_budget_gate_passed": True,
              "paid_execution_authorized": False,
              "paid_model_called": False,
              "network_called_by_evaluator": False,
              "candidates": reports,
              "excluded_claims": [
                  "real_model_task_success",
                  "independent_holdout_performance",
                  "task_generalization",
              ],
          }
          (root / "selection-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Run the Docker sandbox contracts
        shell: bash
        env:
          HORIZON_TEST_DOCKER_IMAGE: python:3.12-alpine
        run: |
          set -euo pipefail
          state_dir=.horizon/docker-contracts
          mkdir -p "$state_dir"
          uv run --locked pytest -q -p no:cacheprovider \
            tests/contract/test_agent_validation.py \
            tests/contract/test_docker.py \
            --junitxml="$state_dir/junit.xml" \
            | tee "$state_dir/pytest.txt"

      - name: Export Docker create-to-start and Agent Worker crash EvidencePacks
        shell: bash
        run: |
          set -euo pipefail
          output=.horizon/docker-created-resume-evidence
          uv run --locked horizon demo docker-created-resume \
            --image python:3.12-alpine \
            --output "$output" \
            | tee .horizon/docker-created-resume-cli.json
          uv run --locked horizon demo verify-docker-created-resume \
            "$output/evidence-pack.json" \
            | tee "$output/offline-verification.json"

          worker_output=.horizon/docker-worker-crash-evidence
          uv run --locked horizon demo docker-worker-crash-resume \
            --image python:3.12-alpine \
            --output "$worker_output" \
            | tee .horizon/docker-worker-crash-cli.json
          uv run --locked horizon demo verify-docker-worker-crash-resume \
            "$worker_output/evidence-pack.json" \
            | tee "$worker_output/offline-verification.json"

      - name: Run the frozen five-case reduced suite
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/reduced-docker-v2
          mkdir -p "$state_dir"
          uv run --locked horizon eval run-ab-suite \
            benchmarks/run_ab/bugsinpy-reduced-v2.yaml \
            --image python:3.12-alpine \
            --state-dir "$state_dir" \
            | tee "$state_dir/cli-result.json"

      - name: Run the twenty-two-case full-checkout suite in network-disabled containers
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/full-checkout-docker-v11
          mkdir -p "$state_dir"
          docker image inspect python:3.12-alpine --format '{{.Id}}'
          set +e
          uv run --locked horizon eval run-ab-suite \
            benchmarks/run_ab/bugsinpy-full-checkout-pilot-v11.yaml \
            --image python:3.12-alpine \
            --state-dir "$state_dir" \
            2>&1 | tee "$state_dir/cli-result.json"
          suite_status=${PIPESTATUS[0]}
          set -e
          if (( suite_status != 0 )); then
            detail="$(tail -c 2000 "$state_dir/cli-result.json" | tr '\n\r' '  ' | sed 's/%/%25/g')"
            echo "::error title=Full-checkout v11 failed::$detail"
            exit "$suite_status"
          fi

      - name: Run the observed TheFuck-2 retrieval-reuse scenario
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/thefuck2-retrieval-reuse-v1
          mkdir -p "$state_dir"
          uv run --locked horizon eval run-ab-suite \
            benchmarks/run_ab/thefuck2-retrieval-reuse-v1.yaml \
            --image python:3.12-alpine \
            --state-dir "$state_dir" \
            | tee "$state_dir/cli-result.json"
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path

          state = Path(".horizon/thefuck2-retrieval-reuse-v1")
          artifacts = state / "artifacts"

          def artifact(ref: str) -> Path:
              return artifacts / ref[:2] / ref

          result = json.loads((state / "cli-result.json").read_text(encoding="utf-8"))
          suite = result["report"]
          if (
              not suite["all_expectations_met"]
              or suite["paid_model_called"]
              or suite["network_called"]
              or suite["case_count"] != 1
              or suite["treatment_recovered_count"] != 1
          ):
              raise SystemExit("TheFuck-2 retrieval-reuse suite boundary failed")
          case = suite["cases"][0]
          case_report = json.loads(artifact(case["report_ref"]).read_text(encoding="utf-8"))
          baseline = case_report["baseline"]
          treatment = case_report["single_replan"]
          if (
              baseline["status"] != "WAITING_FOR_USER"
              or treatment["status"] != "SUCCEEDED"
              or not treatment["final_validation_passed"]
              or not treatment["trace_replay_verified"]
              or not treatment["source_workspace_unchanged"]
          ):
              raise SystemExit("TheFuck-2 treatment did not close the expected loop")

          events = [
              json.loads(line)
              for line in artifact(treatment["trace_ref"]).read_text(
                  encoding="utf-8"
              ).splitlines()
          ]
          settled = [
              event["payload"]["record"]
              for event in events
              if event["event_type"] == "TOOL_CALL_SETTLED"
          ]
          observed = [(record["name"], record["status"]) for record in settled]
          expected = [
              ("retrieve_code", "success"),
              ("retrieve_code", "error"),
              ("read_file", "success"),
              ("revise_plan", "success"),
              ("replace_text", "success"),
              ("submit", "success"),
              ("run_check", "success"),
          ]
          if observed != expected:
              raise SystemExit(f"Unexpected retrieval-reuse tool sequence: {observed}")
          retrieval = artifact(settled[0]["artifact_ref"]).read_text(encoding="utf-8")
          policy = artifact(settled[1]["artifact_ref"]).read_text(encoding="utf-8")
          neighbor = artifact(settled[2]["artifact_ref"]).read_text(encoding="utf-8")
          if (
              not policy.startswith("RetrievalQueryPolicy:")
              or '"path":"thefuck/utils.py"' not in policy
              or '"start_line":16' not in policy
              or '"end_line":155' not in policy
              or "def get_all_executables" not in neighbor
              or len(policy) >= len(retrieval)
          ):
              raise SystemExit("TheFuck-2 reuse hint lost its bounded source evidence")
          reservations = [
              event["payload"]["reservation"]
              for event in events
              if event["event_type"] == "MODEL_CALL_RESERVED"
          ]
          if len(reservations) != 6:
              raise SystemExit("TheFuck-2 treatment model-call count drifted")
          lineage = treatment["reliability"]["retrieval_lineage"]
          if (
              lineage["successful_write_count"] != 1
              or lineage["write_context_bound_count"] != 1
              or lineage["evidence_backed_write_count"] != 1
          ):
              raise SystemExit("TheFuck-2 write lost retrieval evidence lineage")
          evidence = {
              "schema_version": 1,
              "claim_scope": "post_run_scripted_development_regression",
              "external_model_called": False,
              "external_model_cost_cny": "0",
              "network_called_by_evaluator": False,
              "repository_code_executed_in_network_disabled_container": True,
              "baseline_status": baseline["status"],
              "treatment_status": treatment["status"],
              "policy_feedback_chars": len(policy),
              "retrieval_evidence_chars": len(retrieval),
              "post_policy_request_payload_bytes": reservations[2]["request_payload"][
                  "payload_bytes"
              ],
              "post_policy_compacted_unit_count": reservations[2].get(
                  "compacted_unit_count", 0
              ),
              "trace_ref": treatment["trace_ref"],
              "policy_artifact_ref": settled[1]["artifact_ref"],
              "required_check_passed": treatment["final_validation_passed"],
              "trace_replay_verified": treatment["trace_replay_verified"],
              "source_workspace_unchanged": treatment["source_workspace_unchanged"],
              "write_context_bound": True,
              "evidence_backed_write": True,
              "excluded_claims": [
                  "real_model_task_success",
                  "independent_holdout_improvement",
                  "retrieval_ranking_improvement",
              ],
          }
          (state / "trace-reuse-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Run the three-case three-stage recovery suite in network-disabled containers
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/multi-stage-docker-v4
          mkdir -p "$state_dir"
          uv run --locked horizon eval run-ab-suite \
            benchmarks/run_ab/bugsinpy-multi-stage-pilot-v4.yaml \
            --image python:3.12-alpine \
            --state-dir "$state_dir" \
            | tee "$state_dir/cli-result.json"

      - name: Run the source-bound write hard-crash suite in network-disabled containers
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.horizon/multi-stage-hard-crash-docker-v2
          mkdir -p "$state_dir"
          uv run --locked horizon eval run-ab-suite \
            benchmarks/run_ab/bugsinpy-multi-stage-hard-crash-v2.yaml \
            --image python:3.12-alpine \
            --state-dir "$state_dir" \
            | tee "$state_dir/cli-result.json"

      - name: Upload content-addressed evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bound-docker-evidence
          path: |
            .horizon/docker-contracts
            .horizon/docker-created-resume-evidence
            .horizon/docker-created-resume-cli.json
            .horizon/docker-worker-crash-evidence
            .horizon/docker-worker-crash-cli.json
            .horizon/reduced-docker-v2
            .horizon/full-checkout-docker-v11
            .horizon/thefuck2-retrieval-reuse-v1
            .horizon/multi-stage-docker-v4
            .horizon/multi-stage-hard-crash-docker-v2
            .horizon/real-model-pilot-httpie-v1
            .horizon/smoke-candidate-preflight-v1/*/cli-result.json
            .horizon/smoke-candidate-preflight-v1/selection-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence summary
        if: success()
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit = ET.parse(".horizon/docker-contracts/junit.xml").getroot()
          suites = [junit] if junit.tag == "testsuite" else list(junit.findall("testsuite"))
          contract_total = sum(int(suite.attrib["tests"]) for suite in suites)
          contract_failures = sum(int(suite.attrib["failures"]) for suite in suites)
          contract_errors = sum(int(suite.attrib["errors"]) for suite in suites)
          contract_skipped = sum(int(suite.attrib["skipped"]) for suite in suites)
          contract_passed = (
              contract_total - contract_failures - contract_errors - contract_skipped
          )
          contract_names = {
              case.attrib["name"]
              for suite in suites
              for case in suite.findall("testcase")
          }
          created_crash_case = (
              "test_created_attempt_survives_executor_crash_and_is_removed_without_starting"
          )
          if created_crash_case not in contract_names:
              raise SystemExit("Docker create-to-start executor-crash contract is missing")
          resume_case = (
              "test_created_attempt_resumes_with_new_worker_to_terminal_success"
          )
          if resume_case not in contract_names:
              raise SystemExit("Docker resume-to-terminal contract is missing")
          worker_crash_case = (
              "test_lease_owning_agent_worker_crash_is_reaped_and_resumes_to_success"
          )
          if worker_crash_case not in contract_names:
              raise SystemExit("Lease-owning Agent Worker crash contract is missing")
          reduced = json.loads(
              Path(".horizon/reduced-docker-v2/cli-result.json").read_text(encoding="utf-8")
          )
          full = json.loads(
              Path(".horizon/full-checkout-docker-v11/cli-result.json").read_text(
                  encoding="utf-8"
              )
          )
          retrieval_reuse = json.loads(
              Path(
                  ".horizon/thefuck2-retrieval-reuse-v1/trace-reuse-evidence.json"
              ).read_text(encoding="utf-8")
          )
          multi = json.loads(
              Path(".horizon/multi-stage-docker-v4/cli-result.json").read_text(
                  encoding="utf-8"
              )
          )
          hard_crash = json.loads(
              Path(
                  ".horizon/multi-stage-hard-crash-docker-v2/cli-result.json"
              ).read_text(encoding="utf-8")
          )
          smoke_candidates = json.loads(
              Path(
                  ".horizon/smoke-candidate-preflight-v1/selection-evidence.json"
              ).read_text(encoding="utf-8")
          )
          created_resume = json.loads(
              Path(".horizon/docker-created-resume-cli.json").read_text(
                  encoding="utf-8"
              )
          )
          worker_crash = json.loads(
              Path(".horizon/docker-worker-crash-cli.json").read_text(
                  encoding="utf-8"
              )
          )
          reduced_report = reduced["report"]
          full_report = full["report"]
          multi_report = multi["report"]
          hard_crash_report = hard_crash["report"]
          reduced_reliability = reduced_report["reliability"]
          full_reliability = full_report["reliability"]
          multi_reliability = multi_report["reliability"]
          hard_crash_reliability = hard_crash_report["reliability"]
          multi_cases = []
          for case in multi_report["cases"]:
              case_ref = case["report_ref"]
              report = json.loads(
                  (
                      Path(".horizon/multi-stage-docker-v4/artifacts")
                      / case_ref[:2]
                      / case_ref
                  ).read_text(encoding="utf-8")
              )
              multi_cases.append((case["case_id"], report))
          hard_crash_cases = []
          for case in hard_crash_report["cases"]:
              case_ref = case["report_ref"]
              report = json.loads(
                  (
                      Path(".horizon/multi-stage-hard-crash-docker-v2/artifacts")
                      / case_ref[:2]
                      / case_ref
                  ).read_text(encoding="utf-8")
              )
              hard_crash_cases.append((case["case_id"], report))
          expected_hard_crash_profiles = {
              "luigi-1-metrics-handler-three-stage-hard-crash-full": {
                  "tool": "replace_text",
                  "disposition": "accept_replace",
                  "crashed_epoch": 1,
                  "recovery_epoch": 2,
              },
              "fastapi-5-nested-field-clone-three-stage-create-hard-crash-full": {
                  "tool": "create_file",
                  "disposition": "accept_create",
                  "crashed_epoch": 2,
                  "recovery_epoch": 3,
              },
          }
          hard_crash_case_contracts_met = (
              {case_id for case_id, _ in hard_crash_cases}
              == set(expected_hard_crash_profiles)
              and all(
                  report["baseline"]["status"] == "WAITING_FOR_USER"
                  and report["single_replan"]["status"] == "SUCCEEDED"
                  and all(
                      arm["hard_crash"]["observed_exit_code"] == 87
                      and arm["hard_crash"]["tool"] == profile["tool"]
                      and arm["hard_crash"]["recovery_disposition"]
                      == profile["disposition"]
                      and arm["hard_crash"]["crashed_worker_epoch"]
                      == profile["crashed_epoch"]
                      and arm["hard_crash"]["recovery_worker_epoch"]
                      == profile["recovery_epoch"]
                      and arm["hard_crash"]["reservation_without_receipt"]
                      and arm["hard_crash"]["conservative_unknown_recorded"]
                      and arm["hard_crash"]["exact_effect_accepted"]
                      and arm["hard_crash"]["recovered_without_model_redispatch"]
                      and arm["hard_crash"]["one_recovered_tool_receipt"]
                      and arm["worker_restarts"] == 3
                      and arm["final_lease_epoch"] == 4
                      and arm["unknown_model_calls"] == 0
                      and arm["unknown_tool_calls"] == 0
                      and arm["open_reservations"] == 0
                      for arm in (report["baseline"], report["single_replan"])
                  )
                  for case_id, report in hard_crash_cases
                  for profile in (expected_hard_crash_profiles[case_id],)
              )
          )
          suite_reports = (reduced_report, full_report, multi_report, hard_crash_report)
          suite_reliability = tuple(report["reliability"] for report in suite_reports)
          full_case_lineage_covered = all(
              case["reliability"] is not None
              and case["reliability"]["retrieval_lineage_arm_count"]
              == case["reliability"]["arm_count"]
              and case["reliability"]["delivered_retrieval_count"] > 0
              and case["reliability"]["evidence_backed_write_count"] > 0
              for case in full_report["cases"]
          )
          all_expectations_met = (
              all(report["all_expectations_met"] for report in suite_reports)
              and all(
                  reliability["reliability_evidence_arm_count"]
                  == reliability["arm_count"]
                  for reliability in suite_reliability
              )
              and all(
                  reliability["retrieval_lineage_arm_count"]
                  == reliability["arm_count"]
                  for reliability in suite_reliability
              )
              and all(
                  reliability["clean_terminal_success_count"]
                  + reliability["quality_flagged_terminal_success_count"]
                  == reliability["terminal_success_count"]
                  for reliability in suite_reliability
              )
              and full_report["case_count"] == 22
              and full_report["passed_case_count"] == 22
              and full_report["initial_failure_confirmed_count"] == 22
              and full_report["treatment_recovered_count"] == 22
              and hard_crash_report["case_count"] == 2
              and hard_crash_report["passed_case_count"] == 2
              and hard_crash_report["initial_failure_confirmed_count"] == 2
              and hard_crash_report["treatment_recovered_count"] == 2
              and hard_crash_case_contracts_met
              and reduced_reliability["unknown_acceptance_arm_count"] == 5
              and reduced_reliability["clean_terminal_success_count"] == 5
              and reduced_reliability["quality_flagged_terminal_success_count"] == 0
              and reduced_reliability["retrieval_degraded_arm_count"] == 0
              and reduced_reliability["required_check_failure_arm_count"] == 0
              and full_reliability["unknown_acceptance_arm_count"] == 22
              and full_reliability["retrieval_degraded_arm_count"] > 0
              and full_reliability["quality_flagged_terminal_success_count"] > 0
              and full_reliability["required_check_failure_arm_count"] == 0
              and full_reliability["successful_retrieval_count"] > 0
              and full_reliability["delivered_retrieval_count"] > 0
              and full_reliability["evidence_backed_write_count"]
              >= full_report["case_count"]
              and full_case_lineage_covered
              and retrieval_reuse["baseline_status"] == "WAITING_FOR_USER"
              and retrieval_reuse["treatment_status"] == "SUCCEEDED"
              and retrieval_reuse["required_check_passed"]
              and retrieval_reuse["trace_replay_verified"]
              and retrieval_reuse["source_workspace_unchanged"]
              and retrieval_reuse["write_context_bound"]
              and retrieval_reuse["evidence_backed_write"]
              and multi_reliability["required_check_failure_arm_count"] == 0
              and hard_crash_reliability["required_check_failure_arm_count"] == 0
              and created_resume["verified"]
              and created_resume["created_trace_is_terminal_prefix"]
              and created_resume["protected_validation_passed"]
              and created_resume["task_succeeded"]
              and created_resume["terminal_status"] == "SUCCEEDED"
              and created_resume["docker_image_id"].startswith("sha256:")
              and created_resume["resume_worker_id"] == "docker-created-resume-worker"
              and worker_crash["verified"]
              and worker_crash["terminal_status"] == "SUCCEEDED"
              and worker_crash["crashed_worker_exit_code"] == 34
              and worker_crash["worker_epoch_chain"] == "1->2->3"
              and worker_crash["lease_transition"] == "expired_takeover"
              and worker_crash["launch_record_persisted_before_dispatch"]
              and worker_crash["takeover_bound_to_reaped_pid"]
              and worker_crash["original_call_not_redispatched"]
              and worker_crash["protected_validation_passed"]
              and worker_crash["task_succeeded"]
              and multi_reliability["timed_scenario_count"] == 3
              and multi_reliability["trace_replay_rate"] == 1.0
              and multi_reliability["source_workspace_unchanged_rate"] == 1.0
              and multi_reliability["final_open_effect_count"] == 0
              and hard_crash_reliability["timed_scenario_count"] == 2
              and hard_crash_reliability["hard_crash_arm_count"] == 4
              and hard_crash_reliability["recovered_hard_crash_arm_count"] == 4
              and hard_crash_reliability["recovery_success_rate"] == 1.0
              and hard_crash_reliability["recovery_redispatch_count"] == 0
              and hard_crash_reliability["duplicate_side_effect_count"] == 0
              and hard_crash_reliability["trace_replay_rate"] == 1.0
              and hard_crash_reliability["final_open_effect_count"] == 0
              and smoke_candidates["candidate_count"] == 4
              and smoke_candidates["selected_task_id"] == "luigi-2-beam-target-path"
              and smoke_candidates["all_exact_checkout_preflights_ready"]
              and smoke_candidates["cumulative_budget_gate_passed"]
              and not smoke_candidates["paid_execution_authorized"]
          )
          paid_model_called = (
              any(report["paid_model_called"] for report in suite_reports)
              or created_resume["paid_model_called"]
              or worker_crash["paid_model_called"]
              or retrieval_reuse["external_model_called"]
              or smoke_candidates["paid_model_called"]
          )
          network_called = (
              any(report["network_called"] for report in suite_reports)
              or created_resume["network_called"]
              or worker_crash["network_called"]
              or retrieval_reuse["network_called_by_evaluator"]
              or smoke_candidates["network_called_by_evaluator"]
          )
          if not all_expectations_met:
              missing_case_lineage = [
                  case["case_id"]
                  for case in full_report["cases"]
                  if case["reliability"] is None
                  or case["reliability"]["retrieval_lineage_arm_count"]
                  != case["reliability"]["arm_count"]
                  or case["reliability"]["delivered_retrieval_count"] == 0
                  or case["reliability"]["evidence_backed_write_count"] == 0
              ]
              annotation = {
                  "suite_expectations": {
                      report["suite_id"]: report["all_expectations_met"]
                      for report in suite_reports
                  },
                  "suite_lineage_arms": {
                      report["suite_id"]: [
                          report["reliability"]["retrieval_lineage_arm_count"],
                          report["reliability"]["arm_count"],
                      ]
                      for report in suite_reports
                  },
                  "full_lineage": {
                      key: full_reliability[key]
                      for key in (
                          "successful_retrieval_count",
                          "delivered_retrieval_count",
                          "successful_write_count",
                          "write_context_bound_count",
                          "evidence_backed_write_count",
                      )
                  },
                  "missing_full_case_lineage": missing_case_lineage,
                  "hard_crash_case_contracts_met": hard_crash_case_contracts_met,
                  "smoke_candidate_selection": smoke_candidates,
                  "paid_model_called": paid_model_called,
                  "network_called": network_called,
              }
              print(
                  "::error title=Source-bound evidence gate::"
                  + json.dumps(annotation, sort_keys=True)
              )
              diagnostics = {
                  "source_bound_docker_evidence_contract": {
                      "suite_expectations_met": {
                          report["suite_id"]: report["all_expectations_met"]
                          for report in suite_reports
                      },
                      "suite_reliability": {
                          report["suite_id"]: report["reliability"]
                          for report in suite_reports
                      },
                      "full_checkout_counts": {
                          "case_count": full_report["case_count"],
                          "passed_case_count": full_report["passed_case_count"],
                          "initial_failure_confirmed_count": full_report[
                              "initial_failure_confirmed_count"
                          ],
                          "treatment_recovered_count": full_report[
                              "treatment_recovered_count"
                          ],
                          "case_lineage_covered": full_case_lineage_covered,
                      },
                      "full_checkout_case_lineage": {
                          case["case_id"]: {
                              "delivered_retrieval_count": case["reliability"][
                                  "delivered_retrieval_count"
                              ],
                              "evidence_backed_write_count": case["reliability"][
                                  "evidence_backed_write_count"
                              ],
                          }
                          for case in full_report["cases"]
                      },
                      "created_resume_verified": created_resume["verified"],
                      "worker_crash_verified": worker_crash["verified"],
                      "hard_crash_case_contracts_met": hard_crash_case_contracts_met,
                      "smoke_candidate_selection": smoke_candidates,
                  }
              }
              rendered_diagnostics = json.dumps(diagnostics, sort_keys=True)
              print(rendered_diagnostics)
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
                  "## Source-bound Docker evidence gate failed\n\n"
                  "```json\n"
                  + rendered_diagnostics
                  + "\n```\n",
                  encoding="utf-8",
              )
              raise SystemExit("Source-bound Docker evidence contract failed")
          if paid_model_called or network_called:
              raise SystemExit("Source-bound Docker evidence made a forbidden external call")
          lines = [
              "## Frozen source-bound Docker evidence",
              "",
              f"- Docker image ID: `{full_report['validation_backend_ref']}`",
              (
                  "- Docker sandbox contracts: "
                  f"`{contract_passed}/{contract_total}`; skipped `{contract_skipped}`"
              ),
              (
                  "- Docker create-to-start executor crash: effect-executor exit `34` while "
                  "the lease-owning controller survives; exact attempt remains `created`; "
                  "command marker absent; inactive container removed"
              ),
              (
                  "- Replayable create-to-start boundary: transition `"
                  f"{created_resume['attempt_transition']}`; disposition `"
                  f"{created_resume['recovery_disposition']}`; Worker epoch `"
                  f"{created_resume['worker_epoch_handoff']}`; pinned image `"
                  f"{created_resume['docker_image_id']}`"
              ),
              (
                  "- Resume-to-terminal continuation: fresh call identity `"
                  f"{created_resume['crash_call_id']} -> "
                  f"{created_resume['resumed_check_call_id']}`; Trace prefix `"
                  f"{created_resume['created_trace_is_terminal_prefix']}`; protected "
                  f"validation `{created_resume['protected_validation_passed']}`; terminal `"
                  f"{created_resume['terminal_status']}`"
              ),
              (
                  "- Lease-owning Agent Worker crash: PID `"
                  f"{worker_crash['crashed_process_id']}` exited `"
                  f"{worker_crash['crashed_worker_exit_code']}`; epochs `"
                  f"{worker_crash['worker_epoch_chain']}`; takeover `"
                  f"{worker_crash['lease_transition']}`; original call redispatched `"
                  f"{not worker_crash['original_call_not_redispatched']}`; terminal `"
                  f"{worker_crash['terminal_status']}`"
              ),
              (
                  "- Dependency-reduced suite: "
                  f"`{reduced_report['passed_case_count']}/{reduced_report['case_count']}`; "
                  f"report `{reduced['report_ref']}`"
              ),
              (
                  "- Full-checkout suite: "
                  f"`{full_report['passed_case_count']}/{full_report['case_count']}`; "
                  f"report `{full['report_ref']}`"
              ),
              (
                  "- TheFuck-2 observed-query reuse: "
                  f"`{retrieval_reuse['baseline_status']} -> "
                  f"{retrieval_reuse['treatment_status']}`; policy/evidence chars `"
                  f"{retrieval_reuse['policy_feedback_chars']}/"
                  f"{retrieval_reuse['retrieval_evidence_chars']}`; post-policy request `"
                  f"{retrieval_reuse['post_policy_request_payload_bytes']}` bytes; "
                  f"compacted units `"
                  f"{retrieval_reuse['post_policy_compacted_unit_count']}`"
              ),
              (
                  "- Remaining real-model smoke candidates: exact preflight `"
                  f"{smoke_candidates['candidate_count']}/"
                  f"{smoke_candidates['candidate_count']}`; cumulative budget gate `"
                  f"{smoke_candidates['cumulative_budget_gate_passed']}`; selected `"
                  f"{smoke_candidates['selected_task_id']}`; paid authorization `"
                  f"{smoke_candidates['paid_execution_authorized']}`"
              ),
              (
                  "- Dependency-reduced success quality: clean/flagged `"
                  f"{reduced_reliability['clean_terminal_success_count']}/"
                  f"{reduced_reliability['quality_flagged_terminal_success_count']}`; "
                  f"unknown acceptance `{reduced_reliability['unknown_acceptance_arm_count']}`; "
                  "retrieval-degraded arms `"
                  f"{reduced_reliability['retrieval_degraded_arm_count']}`"
              ),
              (
                  "- Full-checkout success quality: clean/flagged `"
                  f"{full_reliability['clean_terminal_success_count']}/"
                  f"{full_reliability['quality_flagged_terminal_success_count']}`; "
                  f"unknown acceptance `{full_reliability['unknown_acceptance_arm_count']}`; "
                  f"degraded arms/records `{full_reliability['degradation_arm_count']}/"
                  f"{full_reliability['degradation_record_count']}`; retrieval-degraded arms `"
                  f"{full_reliability['retrieval_degraded_arm_count']}`"
              ),
              (
                  "- Full-checkout retrieval lineage: delivered/successful `"
                  f"{full_reliability['delivered_retrieval_count']}/"
                  f"{full_reliability['successful_retrieval_count']}`; context-bound/evidence-"
                  f"backed writes `{full_reliability['write_context_bound_count']}/"
                  f"{full_reliability['evidence_backed_write_count']}`"
              ),
              (
                  "- Three-stage recovery suite: "
                  f"`{multi_report['passed_case_count']}/{multi_report['case_count']}`; "
                  f"report `{multi['report_ref']}`"
              ),
              (
                  "- Write hard-crash recovery suite: "
                  f"`{hard_crash_report['passed_case_count']}/"
                  f"{hard_crash_report['case_count']}`; "
                  f"report `{hard_crash['report_ref']}`"
              ),
              (
                  "- Three-stage worker restarts / final epochs: "
                  + "; ".join(
                      f"{case_id} baseline `{case['baseline']['worker_restarts']}/"
                      f"{case['baseline']['final_lease_epoch']}`, treatment "
                      f"`{case['single_replan']['worker_restarts']}/"
                      f"{case['single_replan']['final_lease_epoch']}`"
                      for case_id, case in multi_cases
                  )
              ),
              (
                  "- Hard-crash tool / exit / recovered disposition / worker restarts / final epoch: "
                  + "; ".join(
                      f"{case_id}/{arm_name} `{arm['hard_crash']['tool']}/"
                      f"{arm['hard_crash']['observed_exit_code']}/"
                      f"{arm['hard_crash']['recovery_disposition']}/"
                      f"{arm['worker_restarts']}/{arm['final_lease_epoch']}`"
                      for case_id, case in hard_crash_cases
                      for arm_name, arm in (
                          ("baseline", case["baseline"]),
                          ("treatment", case["single_replan"]),
                      )
                  )
              ),
              (
                  "- Hard-crash recovery without model redispatch: "
                  f"`{all(arm['hard_crash']['recovered_without_model_redispatch'] for _, case in hard_crash_cases for arm in (case['baseline'], case['single_replan']))}`"
              ),
              (
                  "- Three-stage reliability metrics: scenarios `"
                  f"{multi_reliability['scenario_count']}`; arms `"
                  f"{multi_reliability['arm_count']}`; Worker restarts `"
                  f"{multi_reliability['worker_restart_count']}`; Trace replay rate `"
                  f"{multi_reliability['trace_replay_rate']}`; final open effects `"
                  f"{multi_reliability['final_open_effect_count']}`; observed/P95 ms `"
                  f"{multi_reliability['observed_duration_ms']}/"
                  f"{multi_reliability['p95_scenario_duration_ms']}`"
              ),
              (
                  "- Hard-crash reliability metrics: recovered `"
                  f"{hard_crash_reliability['recovered_hard_crash_arm_count']}/"
                  f"{hard_crash_reliability['hard_crash_arm_count']}`; rate `"
                  f"{hard_crash_reliability['recovery_success_rate']}`; redispatch `"
                  f"{hard_crash_reliability['recovery_redispatch_count']}`; duplicate "
                  f"side effects `{hard_crash_reliability['duplicate_side_effect_count']}`; "
                  f"Trace replay rate `{hard_crash_reliability['trace_replay_rate']}`; "
                  f"observed/P95 ms `{hard_crash_reliability['observed_duration_ms']}/"
                  f"{hard_crash_reliability['p95_scenario_duration_ms']}`"
              ),
              (
                  "- Reduced initial failures / recovered treatments: "
                  f"`{reduced_report['initial_failure_confirmed_count']}/"
                  f"{reduced_report['treatment_recovered_count']}`"
              ),
              (
                  "- Full-checkout initial failures / recovered treatments: "
                  f"`{full_report['initial_failure_confirmed_count']}/"
                  f"{full_report['treatment_recovered_count']}`"
              ),
              (
                  "- Three-stage initial failures / recovered treatments: "
                  f"`{multi_report['initial_failure_confirmed_count']}/"
                  f"{multi_report['treatment_recovered_count']}`"
              ),
              (
                  "- Hard-crash initial failures / recovered treatments: "
                  f"`{hard_crash_report['initial_failure_confirmed_count']}/"
                  f"{hard_crash_report['treatment_recovered_count']}`"
              ),
              (
                  "- All expectations met: "
                  f"`{all_expectations_met}`"
              ),
              (
                  "- Paid model / model network calls: "
                  f"`{paid_model_called}` / `{network_called}`"
              ),
              f"- Uploaded artifact digest: `{os.environ['ARTIFACT_DIGEST']}`",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
