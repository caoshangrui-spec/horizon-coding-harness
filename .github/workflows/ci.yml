name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality-gate:
    name: Offline quality gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Run offline test suite
        run: uv run --locked pytest -q -p no:cacheprovider

      - name: Run portfolio demo and verify EvidencePack
        run: |
          uv run --locked horizon demo run --output .horizon/ci-portfolio-demo
          rm .horizon/ci-portfolio-demo/control.sqlite3
          rm .horizon/ci-portfolio-demo/campaign.sqlite3
          rm .horizon/ci-portfolio-demo/retrieval.sqlite3
          uv run --locked horizon demo verify-portfolio .horizon/ci-portfolio-demo/evidence-pack.json

      - name: Upload portfolio EvidencePack
        id: portfolio-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horizon-portfolio-evidence
          path: .horizon/ci-portfolio-demo
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 14

      - name: Run direct-child timeout demo and verify EvidencePack
        run: |
          uv run --locked horizon demo process-timeout --output .horizon/ci-process-timeout
          uv run --locked horizon demo verify-process-timeout .horizon/ci-process-timeout/evidence-pack.json

      - name: Upload direct-child timeout EvidencePack
        id: process-timeout-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horizon-process-timeout-evidence
          path: .horizon/ci-process-timeout
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 14

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          uv export --locked --no-dev --no-emit-project \
            --format requirements.txt \
            --output-file .horizon/wheel-smoke-requirements.txt
          uv venv .horizon/wheel-smoke --python 3.12
          uv pip install \
            --python .horizon/wheel-smoke/bin/python \
            --require-hashes \
            --requirements .horizon/wheel-smoke-requirements.txt
          uv pip install \
            --python .horizon/wheel-smoke/bin/python \
            --no-deps \
            "$wheel"
          .horizon/wheel-smoke/bin/python -c 'from importlib.metadata import version; from pathlib import Path; import tomllib; import horizon; expected = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]; assert horizon.__version__ == version("horizon-coding-harness") == expected; print(expected)'
          .horizon/wheel-smoke/bin/horizon doctor > .horizon/wheel-smoke-doctor.json
          .horizon/wheel-smoke/bin/python -c 'import json; from importlib.metadata import version; from pathlib import Path; payload = json.loads(Path(".horizon/wheel-smoke-doctor.json").read_text(encoding="utf-8")); assert payload["horizon"] == version("horizon-coding-harness"); print(json.dumps({"installed_wheel": payload["horizon"], "doctor": "passed"}))'

      - name: Upload built distributions and wheel smoke receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horizon-built-distributions
          path: |
            dist/*
            .horizon/wheel-smoke-doctor.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 14
