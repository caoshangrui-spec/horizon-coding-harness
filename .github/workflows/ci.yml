name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality-gate:
    name: Offline quality gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Run offline test suite
        run: uv run --locked pytest -q -p no:cacheprovider

      - name: Run portfolio demo and verify EvidencePack
        run: uv run --locked horizon demo run --output .horizon/ci-portfolio-demo

      - name: Run direct-child timeout demo and verify EvidencePack
        run: |
          uv run --locked horizon demo process-timeout --output .horizon/ci-process-timeout
          uv run --locked horizon demo verify-process-timeout .horizon/ci-process-timeout/evidence-pack.json

      - name: Upload direct-child timeout EvidencePack
        id: process-timeout-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: horizon-process-timeout-evidence
          path: .horizon/ci-process-timeout
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 14

      - name: Build wheel and source distribution
        run: uv build
