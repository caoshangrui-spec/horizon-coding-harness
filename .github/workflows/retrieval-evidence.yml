name: External retrieval evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/retrieval-evidence.yml
      - benchmarks/retrieval/**
      - src/horizon/adapters/retrieval/**
      - src/horizon/adapters/workspace/**
      - src/horizon/application/retrieval_*.py
      - src/horizon/domain/evaluation.py
      - src/horizon/interfaces/cli/app.py
      - uv.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-development-v3:
    name: Rebuild and verify 16 development cases
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12

      - name: Materialize pinned production packages
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence
          mkdir -p "$evidence"
          set +e
          uv run --locked horizon eval materialize-retrieval-suite \
            benchmarks/retrieval/external-development-v3/source-materialization.yaml \
            --sources-root .horizon/retrieval-v3/sources \
            --cache-dir .horizon/retrieval-v3/git-cache \
            2>&1 | tee "$evidence/materialization-cli.json"
          materialization_status=${PIPESTATUS[0]}
          set -e
          if (( materialization_status != 0 )); then
            detail="$(tail -c 3000 "$evidence/materialization-cli.json" | tr '\n\r' '  ' | sed 's/%/%25/g')"
            echo "::error title=Pinned source materialization failed::$detail"
            exit "$materialization_status"
          fi
          cp \
            .horizon/retrieval-v3/sources/materialization-receipt.json \
            "$evidence/materialization-receipt.json"

      - name: Run and verify frozen retrieval baseline
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence
          set +e
          uv run --locked horizon eval retrieval-suite \
            benchmarks/retrieval/external-development-v3/development-suite.yaml \
            --sources-root .horizon/retrieval-v3/sources \
            --state-dir .horizon/retrieval-v3/eval-state \
            --baseline benchmarks/retrieval/external-development-v3/baseline-index-v8.yaml \
            2>&1 | tee "$evidence/retrieval-suite.json"
          retrieval_status=${PIPESTATUS[0]}
          set -e
          if (( retrieval_status != 0 )); then
            detail="$(tail -c 3000 "$evidence/retrieval-suite.json" | tr '\n\r' '  ' | sed 's/%/%25/g')"
            echo "::error title=Frozen retrieval baseline failed::$detail"
            exit "$retrieval_status"
          fi

      - name: Replay observed TheFuck-2 model queries
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence
          uv run --locked horizon eval retrieval \
            benchmarks/retrieval/thefuck2-real-model-queries-v1.yaml \
            --source .horizon/retrieval-v3/sources/thefuck-2-executable-path-separator \
            --state-dir .horizon/retrieval-v3/thefuck2-real-model-queries-v1 \
            | tee "$evidence/thefuck2-real-model-queries-v1.json"

      - name: Run frozen query-robustness slice
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence/query-robustness
          mkdir -p "$evidence"

          run_variant_group() {
            local base_case_id="$1"
            local manifest="$2"
            uv run --locked horizon eval retrieval "$manifest" \
              --source ".horizon/retrieval-v3/sources/$base_case_id" \
              --state-dir ".horizon/retrieval-v3/query-$base_case_id" \
              | tee "$evidence/$base_case_id.json"
          }

          run_variant_group \
            cookiecutter-1-non-ascii-context \
            benchmarks/retrieval/external-development-v3/query-robustness-v1/cases/cookiecutter-1.yaml
          run_variant_group \
            luigi-7-status-wont-override \
            benchmarks/retrieval/external-development-v3/query-robustness-v1/cases/luigi-7.yaml
          run_variant_group \
            pysnooper-2-custom-repr \
            benchmarks/retrieval/external-development-v3/query-robustness-v1/cases/pysnooper-2.yaml
          run_variant_group \
            tornado-2-redirect-put-without-body \
            benchmarks/retrieval/external-development-v3/query-robustness-v1/cases/tornado-2.yaml

      - name: Run frozen query-normalization treatment
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence/query-normalization
          mkdir -p "$evidence"

          run_treatment_group() {
            local base_case_id="$1"
            local manifest="$2"
            uv run --locked horizon eval retrieval "$manifest" \
              --source ".horizon/retrieval-v3/sources/$base_case_id" \
              --state-dir ".horizon/retrieval-v3/normalization-$base_case_id" \
              | tee "$evidence/$base_case_id.json"
          }

          run_treatment_group \
            cookiecutter-1-non-ascii-context \
            benchmarks/retrieval/external-development-v3/query-normalization-v1/cases/cookiecutter-1.yaml
          run_treatment_group \
            luigi-7-status-wont-override \
            benchmarks/retrieval/external-development-v3/query-normalization-v1/cases/luigi-7.yaml
          run_treatment_group \
            pysnooper-2-custom-repr \
            benchmarks/retrieval/external-development-v3/query-normalization-v1/cases/pysnooper-2.yaml
          run_treatment_group \
            tornado-2-redirect-put-without-body \
            benchmarks/retrieval/external-development-v3/query-normalization-v1/cases/tornado-2.yaml

      - name: Run frozen selective query-normalization gate
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence/query-normalization-gate
          mkdir -p "$evidence"

          run_gate_group() {
            local base_case_id="$1"
            local manifest="$2"
            uv run --locked horizon eval retrieval "$manifest" \
              --source ".horizon/retrieval-v3/sources/$base_case_id" \
              --state-dir ".horizon/retrieval-v3/gate-$base_case_id" \
              | tee "$evidence/$base_case_id.json"
          }

          run_gate_group \
            cookiecutter-1-non-ascii-context \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-v1/cases/cookiecutter-1.yaml
          run_gate_group \
            luigi-7-status-wont-override \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-v1/cases/luigi-7.yaml
          run_gate_group \
            pysnooper-2-custom-repr \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-v1/cases/pysnooper-2.yaml
          run_gate_group \
            tornado-2-redirect-put-without-body \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-v1/cases/tornado-2.yaml

      - name: Run broader selective-gate development suite
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence/query-normalization-gate-broad
          mkdir -p "$evidence"

          run_broad_group() {
            local base_case_id="$1"
            local manifest="$2"
            uv run --locked horizon eval retrieval "$manifest" \
              --source ".horizon/retrieval-v3/sources/$base_case_id" \
              --state-dir ".horizon/retrieval-v3/gate-broad-$base_case_id" \
              | tee "$evidence/$base_case_id.json"
          }

          run_broad_group cookiecutter-3-read-user-choice \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/cookiecutter-3-read-user-choice.yaml
          run_broad_group httpie-1-unique-download-filename \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/httpie-1-unique-download-filename.yaml
          run_broad_group httpie-4-host-header-overwrite \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/httpie-4-host-header-overwrite.yaml
          run_broad_group httpie-5-escape-long-separator \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/httpie-5-escape-long-separator.yaml
          run_broad_group luigi-2-beam-target-path \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/luigi-2-beam-target-path.yaml
          run_broad_group luigi-3-serialize-tuple-parameter \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/luigi-3-serialize-tuple-parameter.yaml
          run_broad_group sanic-2-asyncio-start-serving \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/sanic-2-asyncio-start-serving.yaml
          run_broad_group sanic-3-routes-with-host \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/sanic-3-routes-with-host.yaml
          run_broad_group sanic-5-root-logger-config \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/sanic-5-root-logger-config.yaml
          run_broad_group thefuck-2-executable-path-separator \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/thefuck-2-executable-path-separator.yaml
          run_broad_group thefuck-5-git-push-bitbucket \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/thefuck-5-git-push-bitbucket.yaml
          run_broad_group tornado-4-static-range-bounds \
            benchmarks/retrieval/external-development-v3/query-normalization-gate-broad-v1/cases/tornado-4-static-range-bounds.yaml

      - name: Run conservative CJK query treatment
        shell: bash
        run: |
          set -euo pipefail
          evidence=.horizon/retrieval-v3-evidence/query-normalization-cjk-conservative
          mkdir -p "$evidence"

          run_conservative_group() {
            local base_case_id="$1"
            local manifest="$2"
            uv run --locked horizon eval retrieval "$manifest" \
              --source ".horizon/retrieval-v3/sources/$base_case_id" \
              --state-dir ".horizon/retrieval-v3/cjk-conservative-$base_case_id" \
              | tee "$evidence/$base_case_id.json"
          }

          run_conservative_group \
            cookiecutter-1-non-ascii-context \
            benchmarks/retrieval/external-development-v3/query-normalization-cjk-conservative-v1/cases/cookiecutter-1.yaml
          run_conservative_group \
            luigi-7-status-wont-override \
            benchmarks/retrieval/external-development-v3/query-normalization-cjk-conservative-v1/cases/luigi-7.yaml
          run_conservative_group \
            pysnooper-2-custom-repr \
            benchmarks/retrieval/external-development-v3/query-normalization-cjk-conservative-v1/cases/pysnooper-2.yaml
          run_conservative_group \
            tornado-2-redirect-put-without-body \
            benchmarks/retrieval/external-development-v3/query-normalization-cjk-conservative-v1/cases/tornado-2.yaml

      - name: Validate evidence boundary and publish summary
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          evidence = Path(".horizon/retrieval-v3-evidence")
          materialization = json.loads(
              (evidence / "materialization-cli.json").read_text(encoding="utf-8")
          )
          evaluation = json.loads(
              (evidence / "retrieval-suite.json").read_text(encoding="utf-8")
          )
          receipt = materialization["receipt"]
          report = evaluation["report"]
          metrics = {metric["cutoff"]: metric for metric in report["metrics_at_k"]}
          if receipt["case_count"] != 16 or receipt["repository_code_executed"]:
              raise SystemExit("Source materialization evidence boundary failed")
          if not evaluation["baseline_verified"]:
              raise SystemExit("Frozen retrieval baseline was not verified")
          if report["paid_model_called"] or report["network_called"]:
              raise SystemExit("Offline retrieval evaluator made a forbidden external call")
          if report["repository_code_executed"]:
              raise SystemExit("Retrieval evaluator executed upstream repository code")
          if metrics[1]["hit_count"] != 11 or metrics[5]["hit_count"] != 16:
              raise SystemExit("Frozen retrieval metrics changed unexpectedly")

          observed_queries = json.loads(
              (evidence / "thefuck2-real-model-queries-v1.json").read_text(
                  encoding="utf-8"
              )
          )["report"]
          observed_cases = observed_queries["cases"]
          if observed_queries["paid_model_called"] or observed_queries["network_called"]:
              raise SystemExit("Observed-query replay made a forbidden external call")
          if [case["first_relevant_rank"] for case in observed_cases] != [1, 6]:
              raise SystemExit("Observed TheFuck-2 query path ranks drifted")
          if observed_cases[0]["returned_paths"][0] != "thefuck/utils.py":
              raise SystemExit("Observed TheFuck-2 rank-1 path drifted")

          robustness = yaml.safe_load(
              Path(
                  "benchmarks/retrieval/external-development-v3/"
                  "query-robustness-v1/result-v1.yaml"
              ).read_text(encoding="utf-8")
          )
          if (
              robustness["execution"]["source_manifest_digest"]
              != receipt["source_manifest_digest"]
          ):
              raise SystemExit("Query robustness source manifest digest drifted")
          robustness_root = evidence / "query-robustness"
          for group in robustness["groups"]:
              payload = json.loads(
                  (robustness_root / f"{group['base_case_id']}.json").read_text(
                      encoding="utf-8"
                  )
              )
              query_report = payload["report"]
              if payload["report_ref"] != group["index_v8_report_ref"]:
                  raise SystemExit(
                      f"Query robustness report drifted for {group['base_case_id']}"
                  )
              if query_report["paid_model_called"] or query_report["network_called"]:
                  raise SystemExit("Query robustness evaluator made an external call")

          normalization = yaml.safe_load(
              Path(
                  "benchmarks/retrieval/external-development-v3/"
                  "query-normalization-v1/result-v1.yaml"
              ).read_text(encoding="utf-8")
          )
          if (
              normalization["execution"]["source_manifest_digest"]
              != receipt["source_manifest_digest"]
          ):
              raise SystemExit("Query normalization source manifest digest drifted")
          normalization_root = evidence / "query-normalization"
          for group in normalization["groups"]:
              payload = json.loads(
                  (normalization_root / f"{group['base_case_id']}.json").read_text(
                      encoding="utf-8"
                  )
              )
              treatment_report = payload["report"]
              if payload["report_ref"] != group["index_v8_report_ref"]:
                  raise SystemExit(
                      f"Query normalization report drifted for {group['base_case_id']}"
                  )
              if treatment_report["paid_model_called"] or treatment_report["network_called"]:
                  raise SystemExit("Query normalization evaluator made an external call")
          if normalization["decision"]["default_runtime_policy"] != "unchanged":
              raise SystemExit("Development treatment unexpectedly changed runtime policy")

          gate = yaml.safe_load(
              Path(
                  "benchmarks/retrieval/external-development-v3/"
                  "query-normalization-gate-v1/result-v1.yaml"
              ).read_text(encoding="utf-8")
          )
          if gate["execution"]["source_manifest_digest"] != receipt["source_manifest_digest"]:
              raise SystemExit("Selective query-normalization source manifest digest drifted")
          gate_root = evidence / "query-normalization-gate"
          for group in gate["groups"]:
              payload = json.loads(
                  (gate_root / f"{group['base_case_id']}.json").read_text(encoding="utf-8")
              )
              gate_report = payload["report"]
              if payload["report_ref"] != group["index_v8_report_ref"]:
                  raise SystemExit(
                      f"Selective query-normalization report drifted for {group['base_case_id']}"
                  )
              if gate_report["paid_model_called"] or gate_report["network_called"]:
                  raise SystemExit("Selective query-normalization evaluator made an external call")
          gate_at_8 = gate["aggregate"]["metrics_at_k"][3]
          if (
              gate_at_8["hit_count"]["selective"] != 16
              or gate_at_8["relevant_path_count"]["selective"] != 30
              or gate["aggregate"]["mean_reciprocal_rank"]["selective"] != 0.549479
          ):
              raise SystemExit("Selective query-normalization metrics changed unexpectedly")
          if gate["decision"]["default_runtime_policy"] != "unchanged":
              raise SystemExit("Selective gate unexpectedly changed runtime policy")

          broad = yaml.safe_load(
              Path(
                  "benchmarks/retrieval/external-development-v3/"
                  "query-normalization-gate-broad-v1/result-v1.yaml"
              ).read_text(encoding="utf-8")
          )
          if broad["execution"]["source_manifest_digest"] != receipt["source_manifest_digest"]:
              raise SystemExit("Broader selective-gate source manifest digest drifted")
          broad_root = evidence / "query-normalization-gate-broad"
          for group in broad["groups"]:
              payload = json.loads(
                  (broad_root / f"{group['base_case_id']}.json").read_text(encoding="utf-8")
              )
              broad_report = payload["report"]
              if payload["report_ref"] != group["index_v8_report_ref"]:
                  raise SystemExit(
                      f"Broader selective-gate report drifted for {group['base_case_id']}"
                  )
              if broad_report["paid_model_called"] or broad_report["network_called"]:
                  raise SystemExit("Broader selective-gate evaluator made an external call")
          broad_at_8 = broad["aggregate"]["metrics_at_k"][3]
          if (
              broad_at_8["hit_count"]["baseline"] != 39
              or broad_at_8["hit_count"]["selective"] != 39
              or broad["aggregate"]["mean_reciprocal_rank"]["selective"] != 0.662153
          ):
              raise SystemExit("Broader selective-gate metrics changed unexpectedly")
          if broad["decision"]["combined_gate_runtime_policy"] != "not_integrated":
              raise SystemExit("Broader evidence unexpectedly changed runtime policy")

          conservative = yaml.safe_load(
              Path(
                  "benchmarks/retrieval/external-development-v3/"
                  "query-normalization-cjk-conservative-v1/result-v1.yaml"
              ).read_text(encoding="utf-8")
          )
          if (
              conservative["execution"]["source_manifest_digest"]
              != receipt["source_manifest_digest"]
          ):
              raise SystemExit("Conservative CJK source manifest digest drifted")
          conservative_root = evidence / "query-normalization-cjk-conservative"
          for group in conservative["groups"]:
              payload = json.loads(
                  (conservative_root / f"{group['base_case_id']}.json").read_text(
                      encoding="utf-8"
                  )
              )
              conservative_report = payload["report"]
              if payload["report_ref"] != group["index_v8_report_ref"]:
                  raise SystemExit(
                      f"Conservative CJK report drifted for {group['base_case_id']}"
                  )
              if conservative_report["paid_model_called"] or conservative_report["network_called"]:
                  raise SystemExit("Conservative CJK evaluator made an external call")
              if len(conservative_report["cases"]) != 1:
                  raise SystemExit("Conservative CJK report shape changed unexpectedly")
              observed = conservative_report["cases"][0]
              if (
                  observed["first_relevant_rank"] != group["additive_rank"]
                  or observed["relevant_path_count"] != group["additive_relevant_path_count"]
                  or observed["retrieval_status"] != group["additive_status"]
                  or observed["returned_paths"] != group["returned_paths"]
              ):
                  raise SystemExit(
                      f"Conservative CJK ranking drifted for {group['base_case_id']}"
                  )
          high_coverage = conservative["high_coverage"]
          if (
              high_coverage["hit_at_8"]["additive"] != "4/4"
              or high_coverage["relevant_paths_at_8"]["additive"] != "7/8"
              or high_coverage["mean_reciprocal_rank"]["additive"] != 0.75
              or conservative["strategy_contract"]["observed_low_coverage_bypass_count"]
              != 12
          ):
              raise SystemExit("Conservative CJK metrics changed unexpectedly")
          if conservative["decision"]["default_runtime_policy"] != "not_integrated":
              raise SystemExit("Conservative CJK evidence unexpectedly changed runtime policy")

          lines = [
              "## External retrieval development evidence",
              "",
              f"- Materialized source cases: `{receipt['case_count']}`",
              f"- Source preparation network used: `{receipt['network_called']}`",
              "- Repository code executed: `false`",
              f"- Baseline projection: `{evaluation['baseline_projection_digest']}`",
              f"- Hit@1: `{metrics[1]['hit_count']}/{report['case_count']}`",
              f"- Hit@5: `{metrics[5]['hit_count']}/{report['case_count']}`",
              f"- Micro recall@8: `{metrics[8]['micro_path_recall']}`",
              f"- MRR: `{report['mean_reciprocal_rank']}`",
              "- Observed TheFuck-2 target-path ranks: `1 / 6`",
              f"- Leakage / empty / degraded: `{report['leakage_count']}/"
              f"{report['empty_count']}/{report['degraded_count']}`",
              (
                  "- Query robustness Hit@8 / path recall@8: `"
                  f"{robustness['aggregate']['metrics_at_k'][3]['hit_count']}/"
                  f"{robustness['aggregate']['query_case_count']} / "
                  f"{robustness['aggregate']['metrics_at_k'][3]['micro_path_recall']}`"
              ),
              (
                  "- Chinese-description Hit@8 / path recall@8: `"
                  f"{robustness['by_variant']['chinese_description']['hit_at_8']} / "
                  f"{robustness['by_variant']['chinese_description']['micro_path_recall_at_8']}`"
              ),
              (
                  "- Query normalization Hit@8 / path recall@8: `"
                  f"{normalization['aggregate']['metrics_at_k'][3]['hit_count']['baseline']}"
                  " -> "
                  f"{normalization['aggregate']['metrics_at_k'][3]['hit_count']['treatment']} / "
                  f"{normalization['aggregate']['metrics_at_k'][3]['micro_path_recall']['baseline']}"
                  " -> "
                  f"{normalization['aggregate']['metrics_at_k'][3]['micro_path_recall']['treatment']}`"
              ),
              (
                  "- Normalized Chinese path recall@8: `"
                  f"{normalization['by_variant']['chinese_description']['micro_path_recall_at_8']['baseline']}"
                  " -> "
                  f"{normalization['by_variant']['chinese_description']['micro_path_recall_at_8']['treatment']}`"
              ),
              (
                  "- Path recall@8 baseline -> always-on -> selective: `"
                  f"{gate_at_8['micro_path_recall']['baseline']} -> "
                  f"{gate_at_8['micro_path_recall']['always_on']} -> "
                  f"{gate_at_8['micro_path_recall']['selective']}`"
              ),
              (
                  "- MRR baseline -> always-on -> selective: `"
                  f"{gate['aggregate']['mean_reciprocal_rank']['baseline']} -> "
                  f"{gate['aggregate']['mean_reciprocal_rank']['always_on']} -> "
                  f"{gate['aggregate']['mean_reciprocal_rank']['selective']}`"
              ),
              "- Selective gate applied / bypassed queries: `8 / 8`",
              (
                  "- Broader gate contract applied / bypassed / errors: `"
                  f"{broad['gate_contract']['observed_apply_count']} / "
                  f"{broad['gate_contract']['observed_bypass_count']} / "
                  f"{broad['gate_contract']['false_activation_count'] + broad['gate_contract']['false_bypass_count']}`"
              ),
              (
                  "- Broader Hit@8 baseline -> selective: `"
                  f"{broad_at_8['hit_count']['baseline']}/48 -> "
                  f"{broad_at_8['hit_count']['selective']}/48`"
              ),
              (
                  "- Broader Chinese Hit@8 / non-empty misses baseline -> selective: `"
                  f"{broad['by_variant']['chinese_description']['hit_at_8']['baseline']} -> "
                  f"{broad['by_variant']['chinese_description']['hit_at_8']['selective']} / "
                  f"{broad['by_variant']['chinese_description']['nonempty_miss_count']['baseline']} -> "
                  f"{broad['by_variant']['chinese_description']['nonempty_miss_count']['selective']}`"
              ),
              (
                  "- Conservative CJK high-coverage Hit@8 / path recall@8: `"
                  f"{high_coverage['hit_at_8']['baseline']} -> "
                  f"{high_coverage['hit_at_8']['additive']} / "
                  f"{high_coverage['micro_path_recall_at_8']['baseline']} -> "
                  f"{high_coverage['micro_path_recall_at_8']['additive']}`"
              ),
              (
                  "- Conservative CJK applied / exact-bypassed: `"
                  f"{conservative['strategy_contract']['observed_high_coverage_apply_count']} / "
                  f"{conservative['strategy_contract']['observed_low_coverage_bypass_count']}`"
              ),
              "- Query normalization default runtime policy: `unchanged`",
              "- Holdout: `sealed and not materialized`",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload source receipt and retrieval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-retrieval-development-v3
          path: .horizon/retrieval-v3-evidence
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
